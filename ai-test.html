<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice-to-Invoice Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
        #output { margin-top: 30px; font-size: 20px; color: #333; border: 1px solid #ccc; padding: 20px; min-height: 100px; }
    </style>
</head>
<body>

    <h1>Test 1: Voice to Text</h1>
    <p>Hit record, speak a fake HVAC invoice, and hit stop.</p>

    <button id="startBtn" style="background-color: lightgreen;">Start Recording</button>
    <button id="stopBtn" style="background-color: lightcoral;" disabled>Stop & Transcribe</button>

    <div id="output">Waiting for audio...</div>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const outputDiv = document.getElementById('output');

        // 1. Ask for Microphone Permission
        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = sendToOpenAI;
            mediaRecorder.start();

            startBtn.disabled = true;
            stopBtn.disabled = false;
            outputDiv.innerHTML = "Recording... Speak now!";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            outputDiv.innerHTML = "Processing audio... Please wait.";
        };

        // 2. Send the Audio to OpenAI Whisper
        async function sendToOpenAI() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            audioChunks = []; // Reset chunks for next time

            const formData = new FormData();
            formData.append("file", audioBlob, "test.webm");
            formData.append("model", "whisper-1");

            try {
                const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                    method: "POST",
                    headers: {
                        // Your exact API key is correctly formatted right here:
                        "Authorization": `Bearer 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` 
                    },
                    body: formData
                });

                const data = await response.json();
                
                if(data.text) {
                    outputDiv.innerHTML = "<b>AI Heard:</b><br><br>" + data.text;
                } else {
                    outputDiv.innerHTML = "Error: " + JSON.stringify(data);
                }

            } catch (error) {
                outputDiv.innerHTML = "Connection Error: " + error.message;
            }
        }
    </script>
</body>
</html>
