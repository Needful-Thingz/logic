<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Needful Thingz - Danger Room Arena</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121a12; overflow: hidden; } 
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 400 },
        physics: { default: 'arcade', arcade: { gravity: { y: 800 }, debug: false } },
        scene: { preload: preload, create: create, update: update },
        backgroundColor: '#121a12' 
    };

    const game = new Phaser.Game(config);
    
    // Core Entities
    let player, joyStickLeft, joyStickRight, platforms;
    let uiElements = []; 
    let meleeText, gunText, ammoText, grenadeText, actionText, rosterText, scoreText, centerMsgText;
    let facingDirection = 0, currentScene, grenadesGroup; 
    let score = 0;
    
    // --- ARMORY DATA ---
    const weaponArmory = {
        'Knife': { name: 'Combat Knife', damage: 28, reach: 40, pierce: 0.15, stun: 0, speed: 80, color: 0xcccccc },
        'Sword': { name: 'Broadsword', damage: 35, reach: 75, pierce: 0.50, stun: 0, speed: 150, color: 0xff3333 },
        'Whip':  { name: 'Energy Whip',  damage: 12, reach: 240, pierce: 0.90, stun: 1.0, speed: 250, color: 0x00ffff }
    };
    let weaponKeys = ['Knife', 'Sword', 'Whip'];
    
    const gunArmory = {
        'Pistol':   { name: 'Service Pistol', damage: 15, fireRate: 300, speed: 900, count: 1, color: 0xcccccc, lifespan: 1000, clipSize: 12, reloadTime: 1000 },
        'Shotgun':  { name: 'Pump Shotgun',   damage: 10, fireRate: 800, speed: 600, count: 5, color: 0xffaa00, lifespan: 300,  clipSize: 6,  reloadTime: 3000 }, 
        'Rifle':    { name: 'Assault Rifle',  damage: 8,  fireRate: 100, speed: 1200,count: 1, color: 0x00ff00, lifespan: 800,  clipSize: 30, reloadTime: 1200 },
        'Sniper':   { name: 'Heavy Sniper',   damage: 60, fireRate: 1200,speed: 2000,count: 1, color: 0xff00ff, lifespan: 1500, clipSize: 5,  reloadTime: 2500 },
        'GrenadeL': { name: 'Grenade Tube',   damage: 45, fireRate: 800, speed: 500, count: 1, color: 0xff5500, lifespan: 1200, clipSize: 4,  reloadTime: 2200 },
        'Rocket':   { name: 'RPG Launcher',   damage: 90, fireRate: 1000,speed: 900, count: 1, color: 0xff0000, lifespan: 2000, clipSize: 1,  reloadTime: 3000 }
    };
    let gunKeys = ['Pistol', 'Shotgun', 'Rifle', 'Sniper', 'GrenadeL', 'Rocket'];
    
    const ordnanceArmory = { 'Frag': { name: 'Frag Grenade', damage: 50, radius: 110, fuse: 1500, maxAmmo: 3, cooldown: 1000, color: 0x00ff00 } };
    let activeOrdnance = ordnanceArmory['Frag'];

    // --- ROSTER MANAGER ---
    let savedRoster = localStorage.getItem('nt_roster');
    const playerRoster = savedRoster ? JSON.parse(savedRoster) : [
        { name: "Vanguard", spriteKey: 'vanguard', color: 0x00aaff, melee: 'Whip',  gun: 'Shotgun' },
        { name: "Recon",    spriteKey: 'recon',    color: 0xaaaa00, melee: 'Knife', gun: 'Rifle' },
        { name: "Heavy",    spriteKey: 'heavy',    color: 0xaa00ff, melee: 'Sword', gun: 'Rocket' }
    ];
    
    let currentRosterIndex = 0, activeCharDef = playerRoster[currentRosterIndex];
    let playerHealth = 100, jumps = 0, playerHealthBar; 
    let currentWeaponIndex = 0, activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife'];
    let currentGunIndex = 1, activeGun = gunArmory[activeCharDef.gun] || gunArmory['Shotgun'];
    let lastFiredTime = 0, currentAmmo = activeGun.clipSize, isReloading = false, reloadTimer;
    let currentOrdnanceAmmo = 3, lastTossedTime = 0;
    
    // --- COMBAT FLAGS ---
    let specialCharge = 0, specialReady = false, meleeHitbox;
    const specialMax = 100;
    let specialButton, specialGraphics;
    let comboStep = 0, isAttacking = false, inputBuffered = false, canCancel = false;
    let attackActiveTimer, attackRecoveryTimer;
    let isBlocking = false, isDashing = false, canDash = true, isInvincible = false, isSpawning = false;
    
    // --- ARENA VARS ---
    let enemiesGroup, enemyProjectiles, spawnTimer;
    let spawnRate = 2500; // Starts at 2.5 seconds, speeds up over time

    function preload() {
        this.load.plugin('rexvirtualjoystickplugin', 'https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js', true);
        this.load.image('bg1', 'assets/bg1.png');
        this.load.image('bg2', 'assets/bg2.png');
        this.load.image('bg3', 'assets/bg3.png');
        this.load.image('floorTile', 'assets/bg4.png');

        this.load.spritesheet('vanguard', 'assets/vanguard.png', { frameWidth: 56, frameHeight: 37 });
        this.load.spritesheet('recon', 'assets/recon.png', { frameWidth: 56, frameHeight: 37 });
        this.load.spritesheet('heavy', 'assets/heavy.png', { frameWidth: 56, frameHeight: 37 });
    }

    function create() {
        currentScene = this; 
        
        // Single screen arena bounds
        this.physics.world.setBounds(0, 0, 800, 400);
        this.physics.world.setBoundsCollision(true, true, true, false); 

        let bg1Height = this.textures.get('bg1').getSourceImage().height;
        let scale1 = 400 / bg1Height;
        this.add.tileSprite(0, 0, 800 / scale1, bg1Height, 'bg1').setOrigin(0, 0).setScale(scale1); 

        let bg2Height = this.textures.get('bg2').getSourceImage().height;
        let scale2 = 400 / bg2Height;
        this.add.tileSprite(0, 400, 800 / scale2, bg2Height, 'bg2').setOrigin(0, 1).setScale(scale2); 

        let bg3Height = this.textures.get('bg3').getSourceImage().height;
        let scale3 = 400 / bg3Height;
        this.add.tileSprite(0, 400, 800 / scale3, bg3Height, 'bg3').setOrigin(0, 1).setScale(scale3);

        grenadesGroup = this.physics.add.group(); 
        enemiesGroup = this.physics.add.group();
        enemyProjectiles = this.physics.add.group();
        platforms = this.physics.add.staticGroup();

        // Solid floor for the arena
        platforms.add(this.add.tileSprite(400, 390, 800, 32, 'floorTile')); 
        // Optional: A couple of small side platforms to jump on
        platforms.add(this.add.tileSprite(150, 250, 100, 16, 'floorTile'));
        platforms.add(this.add.tileSprite(650, 250, 100, 16, 'floorTile'));

        // --- PLAYER SETUP ---
        player = this.physics.add.sprite(400, 200, activeCharDef.spriteKey); 
        player.setScale(2);
        player.setCollideWorldBounds(true);

        // --- UNIVERSAL ANIMATION LOOP ---
        const charKeys = ['vanguard', 'recon', 'heavy'];
        charKeys.forEach(char => {
            this.anims.create({ key: `${char}_unarmed_idle`, frames: this.anims.generateFrameNumbers(char, { start: 50, end: 50 }), frameRate: 4, repeat: -1 });
            this.anims.create({ key: `${char}_run_normal`, frames: this.anims.generateFrameNumbers(char, { start: 62, end: 67 }), frameRate: 12, repeat: -1 });
            this.anims.create({ key: `${char}_punch_right`, frames: this.anims.generateFrameNumbers(char, { start: 91, end: 95 }), frameRate: 15 });
            this.anims.create({ key: `${char}_punch_left`, frames: this.anims.generateFrameNumbers(char, { start: 96, end: 100 }), frameRate: 15 });
            this.anims.create({ key: `${char}_whip_stand`, frames: this.anims.generateFrameNumbers(char, { start: 117, end: 124 }), frameRate: 15 });
        });

        meleeHitbox = this.add.rectangle(-100, -100, 40, 20, 0xffffff).setAlpha(0);
        this.physics.add.existing(meleeHitbox); meleeHitbox.body.setAllowGravity(false);

        playerHealthBar = this.add.graphics().setDepth(10);

        this.physics.add.collider(player, platforms);
        this.physics.add.collider(enemiesGroup, platforms); 
        this.physics.add.collider(grenadesGroup, platforms);
        this.physics.add.overlap(player, enemyProjectiles, (p, proj) => { proj.destroy(); playerTakeDamage(proj.dmg, proj.x); });

        // --- UI SETUP ---
        meleeText = this.add.text(10, 10, 'Melee: ', { fontSize: '12px', fill: '#ffffff', backgroundColor: '#000000' }); uiElements.push(meleeText);
        gunText = this.add.text(10, 25, 'Gun: ', { fontSize: '12px', fill: '#ffff00', backgroundColor: '#000000' }); uiElements.push(gunText);
        ammoText = this.add.text(10, 40, `Ammo: `, { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold', backgroundColor: '#000000' }); uiElements.push(ammoText);
        grenadeText = this.add.text(10, 60, `Nades: `, { fontSize: '14px', fill: '#00ff00', fontStyle: 'bold', backgroundColor: '#000000' }); uiElements.push(grenadeText);
        actionText = this.add.text(400, 20, 'Ready', { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5); uiElements.push(actionText);
        rosterText = this.add.text(400, 40, 'TEAM: 3 LIVES', { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5); uiElements.push(rosterText);
        scoreText = this.add.text(400, 65, 'SCORE: 0', { fontSize: '22px', fill: '#ffaa00', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5); uiElements.push(scoreText);
        centerMsgText = this.add.text(400, 150, '', { fontSize: '32px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setAlpha(0);
        uiElements.push(centerMsgText);

        // CONTROLS
        joyStickLeft = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 120, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xcccccc).setAlpha(0.5), dir: '8dir', forceMin: 16 });
        joyStickRight = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 680, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xff0000).setAlpha(0.5), dir: '8dir', forceMin: 16 });

        // DEDICATED JUMP BUTTON
        const btnJump = this.add.circle(240, 320, 25, 0x00ffff).setAlpha(0.6).setInteractive(); uiElements.push(btnJump);
        const btnJumpT = this.add.text(240, 320, 'JMP', { fontSize: '14px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnJumpT);
        btnJump.on('pointerdown', () => { 
            if (!isAttacking && !isBlocking && !isDashing && jumps < 3 && !isSpawning) { 
                player.body.setVelocityY(-450); jumps++; actionText.setText('Jump: ' + jumps + '/3'); 
            } 
        });

        const btnDefend = this.add.circle(580, 300, 25, 0x888888).setAlpha(0.8).setInteractive(); uiElements.push(btnDefend);
        const btnDefendT = this.add.text(580, 300, 'DEF', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnDefendT);
        btnDefend.on('pointerdown', () => {
            if (isAttacking || isDashing || isSpawning) return;
            if (joyStickLeft.left || joyStickLeft.right) { if (canDash) executeDash(); } 
            else { isBlocking = true; player.setTint(0x888888); actionText.setText('BLOCKING'); }
        });
        btnDefend.on('pointerup', releaseBlock); btnDefend.on('pointerout', releaseBlock);
        function releaseBlock() { if (isBlocking) { isBlocking = false; player.clearTint(); actionText.setText('Ready'); } }

        const btnMelee = this.add.circle(610, 230, 25, 0xffaa00).setAlpha(0.6).setInteractive(); uiElements.push(btnMelee);
        const btnMeleeT = this.add.text(610, 230, 'HIT', { fontSize: '14px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnMeleeT);
        btnMelee.on('pointerdown', () => { if (isBlocking || isDashing || isSpawning) return; if (!isAttacking) executeAttack(1); else { inputBuffered = true; if (canCancel && comboStep < 3) triggerNextHit(); } });

        const btnToss = this.add.circle(680, 210, 25, 0x00cc00).setAlpha(0.6).setInteractive(); uiElements.push(btnToss);
        const btnTossT = this.add.text(680, 210, 'TOSS', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnTossT);
        btnToss.on('pointerdown', tossGrenade);

        const btnReload = this.add.circle(550, 240, 25, 0x4444ff).setAlpha(0.7).setInteractive(); uiElements.push(btnReload);
        const btnReloadT = this.add.text(550, 240, 'RLD', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnReloadT);
        btnReload.on('pointerdown', () => { if (!isReloading && !isAttacking && !isBlocking && !isDashing && !isSpawning && currentAmmo < activeGun.clipSize) reloadGun(); });

        const btnHeavy = this.add.circle(630, 170, 25, 0xff3300).setAlpha(0.7).setInteractive(); uiElements.push(btnHeavy);
        const btnHeavyT = this.add.text(630, 170, 'HVY', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(btnHeavyT);
        btnHeavy.on('pointerdown', () => { if (!isBlocking && !isDashing && !isAttacking && !isSpawning) executeHeavyAttack(); });

        specialButton = this.add.circle(750, 210, 30, 0x555555).setAlpha(0.7).setInteractive(); uiElements.push(specialButton);
        const specialButtonT = this.add.text(750, 210, 'ULT', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(specialButtonT);
        specialGraphics = this.add.graphics(); uiElements.push(specialGraphics);
        specialButton.on('pointerdown', () => {
            if (specialReady && !isAttacking && !isBlocking && !isSpawning) {
                player.setTint(0x00ffff);
                enemiesGroup.getChildren().forEach(enemy => {
                    if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 250) { 
                        dealDamageToEnemy(enemy, 50, 0.8, 0); enemy.fillColor = 0x00ffff; this.time.delayedCall(200, () => { if(enemy.active) enemy.fillColor = 0xff5555; }); 
                    }
                });
                this.time.delayedCall(500, () => player.clearTint());
                specialCharge = 0; specialReady = false; specialButton.setFillStyle(0x555555); specialGraphics.clear();
            }
        });

        applyCharacterLoadout();

        // --- ENDLESS SPAWNER ---
        startSpawner();
    }

    function startSpawner() {
        if(spawnTimer) spawnTimer.remove();
        spawnTimer = currentScene.time.addEvent({
            delay: spawnRate,
            callback: () => {
                if (playerHealth > 0) {
                    // Spawn left or right side of screen randomly
                    let xPos = Phaser.Math.Between(0, 1) === 0 ? 50 : 750;
                    spawnEnemyAt(xPos, 300);
                    
                    // Gradually increase difficulty
                    if(spawnRate > 800) spawnRate -= 50; 
                    startSpawner(); 
                }
            }
        });
    }

    function playAnim(animSuffix) {
        player.anims.play(`${activeCharDef.spriteKey}_${animSuffix}`, true);
    }

    function showCenterMessage(text, color) {
        centerMsgText.setText(text); centerMsgText.setFill(color); centerMsgText.setAlpha(1);
        currentScene.tweens.add({ targets: centerMsgText, alpha: 0, delay: 2000, duration: 1000 });
    }

    function spawnEnemyAt(x, y) {
        let enemy = currentScene.add.rectangle(x, y, 30, 50, 0xff5555);
        currentScene.physics.add.existing(enemy); enemy.body.setCollideWorldBounds(true);
        let hitbox = currentScene.add.rectangle(-100, -100, 30, 30, 0xffffff).setAlpha(0); currentScene.physics.add.existing(hitbox); hitbox.body.setAllowGravity(false);
        let barGraphics = currentScene.add.graphics().setDepth(10);
        // Slightly scaling enemy HP based on score for endless progression
        let hpScaling = 60 + (Math.floor(score / 100) * 10);
        enemy.enemyData = { isBoss: false, hp: hpScaling, maxHp: hpScaling, armor: 20, maxArmor: 20, state: 'idle', canAttack: true, isStunned: false, hitbox: hitbox, bars: barGraphics };
        enemiesGroup.add(enemy);
    }

    function applyCharacterLoadout() {
        activeCharDef = playerRoster[currentRosterIndex]; 
        player.clearTint(); 
        player.setTexture(activeCharDef.spriteKey);
        
        currentWeaponIndex = weaponKeys.indexOf(activeCharDef.melee); activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife'];
        currentGunIndex = gunKeys.indexOf(activeCharDef.gun); activeGun = gunArmory[activeCharDef.gun] || gunArmory['Shotgun'];
        playerHealth = 100; currentAmmo = activeGun.clipSize; currentOrdnanceAmmo = activeOrdnance.maxAmmo;
        isReloading = false; isSpawning = false;
        meleeText.setText('Melee: ' + activeWeapon.name); gunText.setText('Gun: ' + activeGun.name);
        rosterText.setText(`TEAM: ${3 - currentRosterIndex} LIVES`); actionText.setText(`${activeCharDef.name} DROPS IN!`); updateUI();
    }

    function spawnNextCharacter() {
        if (currentRosterIndex >= 3) return; 
        isSpawning = true; isInvincible = true;
        player.x = 400; player.y = -50; player.body.setVelocityY(800); 
        applyCharacterLoadout();
        player.setAlpha(0.5);
        currentScene.time.delayedCall(1500, () => { isInvincible = false; player.setAlpha(1); actionText.setText('Ready'); });
    }

    function spawnDamageText(x, y, amount, isCritical = false, isPlayerHit = false) {
        let fontSize = isCritical ? '26px' : '16px'; let color = isPlayerHit ? '#ff3333' : '#ffdd00'; 
        let floatText = currentScene.add.text(x, y, Math.round(amount).toString(), { fontSize: fontSize, fill: color, fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5);
        currentScene.tweens.add({ targets: floatText, x: floatText.x + Phaser.Math.Between(-25, 25), y: floatText.y - 60, alpha: 0, duration: 900, ease: 'Cubic.easeOut', onComplete: () => floatText.destroy() });
    }

    // UPDATED WHIP PHYSICS
    function drawWhipFX(isHeavy) {
        let slashGraphic = currentScene.add.graphics();
        slashGraphic.lineStyle(isHeavy ? 10 : 4, activeWeapon.color, 1);
        slashGraphic.beginPath();
        
        let whipLength = (facingDirection === 0) ? activeWeapon.reach : -activeWeapon.reach;
        let startY = player.y - 5;
        
        slashGraphic.moveTo(player.x, startY);
        slashGraphic.lineTo(player.x + whipLength * 0.4, startY - 15);
        slashGraphic.lineTo(player.x + whipLength * 0.8, startY + 10);
        slashGraphic.lineTo(player.x + whipLength, startY);
        slashGraphic.strokePath();
        
        let crack = currentScene.add.circle(player.x + whipLength, startY, isHeavy ? 25 : 12, 0xffffff, 0.9);
        currentScene.tweens.add({ targets: crack, scale: 1.5, alpha: 0, duration: 150, onComplete: () => crack.destroy() });
        currentScene.tweens.add({ targets: slashGraphic, alpha: 0, duration: 150, onComplete: () => slashGraphic.destroy() });
    }

    function executeHeavyAttack() {
        isAttacking = true; inputBuffered = false; canCancel = false; 
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        actionText.setText(`WINDUP: ${activeWeapon.name}!`);
        
        if (activeWeapon.name === 'Energy Whip') playAnim('whip_stand'); else playAnim('punch_right');

        currentScene.time.delayedCall(activeWeapon.speed * 1.5, () => {
            actionText.setText(`HEAVY STRIKE!`);
            let currentReach = activeWeapon.reach * 1.5; meleeHitbox.width = currentReach; meleeHitbox.height = 40; 
            meleeHitbox.setAlpha(0); 
            let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
            meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

            if (activeWeapon.name === 'Energy Whip') { drawWhipFX(true); } 
            else {
                let slashGraphic = currentScene.add.graphics(); slashGraphic.lineStyle(10, activeWeapon.color, 1); slashGraphic.beginPath();
                slashGraphic.arc(player.x, player.y, 50, Phaser.Math.DegToRad(facingDirection === 0 ? -90 : 270), Phaser.Math.DegToRad(90), false);
                slashGraphic.strokePath(); currentScene.tweens.add({ targets: slashGraphic, alpha: 0, duration: 300, onComplete: () => slashGraphic.destroy() });
            }

            enemiesGroup.getChildren().forEach(enemy => {
                if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), enemy.getBounds())) {
                    let heavyStun = activeWeapon.stun > 0 ? activeWeapon.stun * 2 : 0.5;
                    dealDamageToEnemy(enemy, activeWeapon.damage * 2.5, activeWeapon.pierce, heavyStun);
                    enemy.fillColor = activeWeapon.color; currentScene.time.delayedCall(100, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = 0xff5555; });
                    if(enemy.active) enemy.body.setVelocityX(facingDirection === 0 ? 300 : -300);
                }
            });
            attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
                meleeHitbox.setPosition(-100, -100); 
                attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * 2.5, () => { isAttacking = false; playAnim('unarmed_idle'); actionText.setText('Ready'); });
            });
        });
    }

    function executeAttack(step) {
        isAttacking = true; comboStep = step; inputBuffered = false; canCancel = false;
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        
        if (activeWeapon.name === 'Energy Whip') playAnim('whip_stand');
        else if (step === 1) playAnim('punch_right'); else playAnim('punch_left');

        let currentReach = step === 3 ? activeWeapon.reach * 1.5 : activeWeapon.reach;
        meleeHitbox.width = currentReach; meleeHitbox.height = step === 3 ? 40 : 20; meleeHitbox.setAlpha(0); 
        let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
        meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

        currentScene.time.delayedCall(activeWeapon.speed * 0.5, () => {
            if (activeWeapon.name === 'Energy Whip') { drawWhipFX(false); } 
            else {
                let slashGraphic = currentScene.add.graphics(); slashGraphic.lineStyle(6, activeWeapon.color, 1); slashGraphic.beginPath();
                slashGraphic.arc(player.x, player.y, 30, Phaser.Math.DegToRad(facingDirection === 0 ? -45 : 225), Phaser.Math.DegToRad(facingDirection === 0 ? 45 : 135), false);
                slashGraphic.strokePath(); currentScene.tweens.add({ targets: slashGraphic, alpha: 0, duration: 200, onComplete: () => slashGraphic.destroy() });
            }

            enemiesGroup.getChildren().forEach(enemy => {
                if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), enemy.getBounds())) {
                    dealDamageToEnemy(enemy, activeWeapon.damage * (step === 3 ? 2 : 1), activeWeapon.pierce, activeWeapon.stun);
                    enemy.fillColor = activeWeapon.color; currentScene.time.delayedCall(100, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = 0xff5555; });
                    if(step === 3 && enemy.active) enemy.body.setVelocityX(facingDirection === 0 ? 150 : -150);
                }
            });
        });

        attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
            meleeHitbox.setPosition(-100, -100); canCancel = true; 
            if (inputBuffered && step < 3) triggerNextHit();
            else { attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * (step === 3 ? 2.5 : 1.5), () => { isAttacking = false; comboStep = 0; inputBuffered = false; canCancel = false; playAnim('unarmed_idle'); }); }
        });
    }
    function triggerNextHit() { if (comboStep < 3) executeAttack(comboStep + 1); }

    function executeDash() {
        isDashing = true; canDash = false; isInvincible = true; actionText.setText('DODGE!');
        player.setAlpha(0.5); player.setTint(0x00ffff); player.body.setVelocityX((facingDirection === 0) ? 700 : -700);
        currentScene.time.delayedCall(250, () => { isDashing = false; isInvincible = false; player.setAlpha(1); player.clearTint(); actionText.setText('Ready'); });
        currentScene.time.delayedCall(1200, () => { canDash = true; });
    }

    function playerTakeDamage(incomingDmg, attackXLocation) {
        if (isInvincible || playerHealth <= 0) return; 
        let finalDmg = incomingDmg;
        if (isBlocking) {
            let playerFacingRight = (facingDirection === 0), attackFromRight = (attackXLocation > player.x);
            if ((playerFacingRight && attackFromRight) || (!playerFacingRight && !attackFromRight)) finalDmg *= 0.2; 
        }
        player.setTint(0xff0000); currentScene.time.delayedCall(150, () => { if (!isBlocking && !isAttacking && !isDashing) player.clearTint(); });
        playerHealth -= finalDmg; spawnDamageText(player.x, player.y - 30, finalDmg, finalDmg >= 30, true);
        
        if (playerHealth <= 0) { 
            playerHealth = 0; currentRosterIndex++;
            if (currentRosterIndex < playerRoster.length) spawnNextCharacter();
            else { player.setAlpha(0); actionText.setText('ARENA OVER'); rosterText.setText('TEAM: 0 LIVES'); if(spawnTimer) spawnTimer.remove(); showCenterMessage(`FINAL SCORE: ${score}`, '#ffaa00'); currentScene.time.delayedCall(4000, () => { window.location.href = 'debrief.html?status=lose'; }); }
        } 
    }

    function tossGrenade() {
        if (currentOrdnanceAmmo <= 0 || isAttacking || isBlocking || isDashing || isSpawning || currentScene.time.now < lastTossedTime + activeOrdnance.cooldown) return;
        currentOrdnanceAmmo--; updateUI(); lastTossedTime = currentScene.time.now; actionText.setText("TOSS!");
        let nade = currentScene.add.circle(player.x, player.y - 10, 6, activeOrdnance.color);
        currentScene.physics.add.existing(nade); nade.body.setBounce(0.6); nade.body.setDrag(100, 0); nade.body.setCollideWorldBounds(true);
        grenadesGroup.add(nade); nade.body.setVelocity((facingDirection === 0) ? 350 : -350, -400);
        currentScene.time.delayedCall(activeOrdnance.fuse, () => explodeGrenade(nade));
    }
    
    function explodeGrenade(nade) {
        let exX = nade.x, exY = nade.y; nade.destroy();
        let blastVisual = currentScene.add.circle(exX, exY, activeOrdnance.radius, 0xff7700, 0.7);
        enemiesGroup.getChildren().forEach(enemy => {
            if (Phaser.Math.Distance.Between(exX, exY, enemy.x, enemy.y) <= activeOrdnance.radius) {
                dealDamageToEnemy(enemy, activeOrdnance.damage, 0.5, 0); enemy.fillColor = 0xff7700; currentScene.time.delayedCall(150, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = 0xff5555; });
            }
        });
        currentScene.tweens.add({ targets: blastVisual, alpha: 0, duration: 250, onComplete: () => blastVisual.destroy() });
    }

    function reloadGun() {
        isReloading = true; actionText.setText(`Reloading...`); ammoText.setText('RELOADING...'); ammoText.setFill('#ff0000'); 
        reloadTimer = currentScene.time.delayedCall(activeGun.reloadTime, () => { currentAmmo = activeGun.clipSize; isReloading = false; updateUI(); actionText.setText('Ready'); });
    }

    function updateUI() {
        ammoText.setText(`Ammo: ${currentAmmo} / ${activeGun.clipSize}`);
        if (currentAmmo === 0) ammoText.setFill('#ff0000'); else if (currentAmmo <= activeGun.clipSize * 0.25) ammoText.setFill('#ffaa00'); else ammoText.setFill('#00ffff'); 
        grenadeText.setText(`Nades: ${currentOrdnanceAmmo} / ${activeOrdnance.maxAmmo}`);
        if (currentOrdnanceAmmo === 0) grenadeText.setFill('#ff0000'); else grenadeText.setFill('#00ff00');
    }

    function shootGun(baseAngle) {
        for (let i = 0; i < activeGun.count; i++) {
            let currentAngle = baseAngle + (i - Math.floor(activeGun.count / 2)) * 0.15;
            let bullet = currentScene.add.rectangle(player.x, player.y, 12, 4, activeGun.color);
            currentScene.physics.add.existing(bullet); bullet.body.setAllowGravity(false); 
            currentScene.physics.velocityFromRotation(currentAngle, activeGun.speed, bullet.body.velocity); bullet.rotation = currentAngle;
            currentScene.physics.add.overlap(bullet, enemiesGroup, (b, enemy) => {
                b.destroy(); dealDamageToEnemy(enemy, activeGun.damage, 0.20, 0); enemy.fillColor = activeGun.color; 
                currentScene.time.delayedCall(50, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = 0xff5555; });
            });
            currentScene.time.delayedCall(activeGun.lifespan, () => { if(bullet.active) bullet.destroy(); });
        }
    }

    function destroyEnemy(enemy) {
        if (!enemy.active) return;
        if (enemy.enemyData.bars) enemy.enemyData.bars.destroy();
        if (enemy.enemyData.hitbox) enemy.enemyData.hitbox.destroy();
        enemy.destroy();
    }

    function dealDamageToEnemy(enemy, dmg, piercePercent, stunDuration) {
        if (!enemy.active) return;
        let data = enemy.enemyData; let piercingDmg = dmg * piercePercent, standardDmg = dmg - piercingDmg;
        if (data.armor > 0) { data.armor -= standardDmg; if (data.armor < 0) { data.hp += data.armor; data.armor = 0; } } else { data.hp -= standardDmg; }
        data.hp -= piercingDmg; spawnDamageText(enemy.x + Phaser.Math.Between(-10, 10), enemy.y - 30, Math.round(dmg), dmg >= 40, false);
        if (stunDuration > 0) {
            data.isStunned = true; data.state = 'stunned'; enemy.fillColor = 0x00ffff;
            currentScene.time.delayedCall(stunDuration * 1000, () => { if(enemy.active) { data.isStunned = false; data.state = 'idle'; enemy.fillColor = 0xff5555; } });
        }
        if (data.hp <= 0) { score += 10; scoreText.setText('SCORE: ' + score); destroyEnemy(enemy); }
    }

    function drawFloatingBars() {
        playerHealthBar.clear(); 
        if (playerHealth > 0 && !isSpawning) { playerHealthBar.fillStyle(0x333333, 1).fillRect(player.x - 20, player.y - 40, 40, 5); playerHealthBar.fillStyle(0x00ff00, 1).fillRect(player.x - 20, player.y - 40, 40 * (playerHealth / 100), 5); }
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; 
            if (data.bars) {
                let bars = data.bars; bars.clear();
                bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 45, 50, 6); bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 36, 50, 6);
                bars.fillStyle(0x00ff00, 1).fillRect(enemy.x - 25, enemy.y - 45, 50 * (data.hp / data.maxHp), 6); bars.fillStyle(0xcccccc, 1).fillRect(enemy.x - 25, enemy.y - 36, 50 * (data.armor / data.maxArmor), 6);
            }
        });
    }

    function update() {
        drawFloatingBars(); let currentTime = currentScene.time.now;

        // Player Logic with Animations
        if (!isDashing && !isAttacking && !isBlocking && !isSpawning && playerHealth > 0) {
            player.rotation = 0; 
            if (joyStickLeft.left) { player.body.setVelocityX(-250); facingDirection = Math.PI; player.setFlipX(true); playAnim('run_normal'); }
            else if (joyStickLeft.right) { player.body.setVelocityX(250); facingDirection = 0; player.setFlipX(false); playAnim('run_normal'); }
            else { player.body.setVelocityX(0); playAnim('unarmed_idle'); }
            
            if (player.body.touching.down) jumps = 0;

            if (joyStickRight.force > 0) {
                if (Math.abs(joyStickRight.rotation) > Math.PI/2) { facingDirection = Math.PI; player.setFlipX(true); } else { facingDirection = 0; player.setFlipX(false); }
                if (currentTime > lastFiredTime + activeGun.fireRate && !isReloading) {
                    if (currentAmmo > 0) { shootGun(joyStickRight.rotation); currentAmmo--; updateUI(); lastFiredTime = currentTime; } else reloadGun();
                }
            } 
        } else if (isAttacking || isBlocking) { player.body.setVelocityX(0); player.rotation = 0; }
        
        // Enemies Loop
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; 
            if (enemy.y > 450) { destroyEnemy(enemy); return; }
            let distToPlayer = Phaser.Math.Distance.Between(enemy.x, enemy.y, player.x, player.y);

            if (!data.isStunned && playerHealth > 0 && !isSpawning) {
                if (distToPlayer < 65 && data.canAttack) {
                    data.state = 'attack'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.fillColor = 0xffffff;
                    currentScene.time.delayedCall(400, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0) return; 
                        enemy.fillColor = 0xff5555; data.hitbox.setPosition(enemy.x + (enemy.x < player.x ? 25 : -25), enemy.y); data.hitbox.setAlpha(1);
                        if (Phaser.Geom.Intersects.RectangleToRectangle(data.hitbox.getBounds(), player.getBounds())) { playerTakeDamage(25, enemy.x); }
                        currentScene.time.delayedCall(150, () => { data.hitbox.setAlpha(0); data.hitbox.setPosition(-100, -100); data.state = 'idle'; });
                    });
                    currentScene.time.delayedCall(2000, () => { data.canAttack = true; });
                } else if (distToPlayer >= 65 && data.state !== 'attack') {
                    data.state = 'chase'; let dir = (player.x > enemy.x) ? 1 : -1; enemy.body.setVelocityX(100 * dir); 
                    if (enemy.body.blocked.left || enemy.body.blocked.right) { if(enemy.body.touching.down) enemy.body.setVelocityY(-400); }
                } else if (data.state !== 'attack') { data.state = 'idle'; enemy.body.setVelocityX(0); }
            } else { if (data.state !== 'attack') enemy.body.setVelocityX(0); }
        });

        // Special Attack Charge
        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(750, 210, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false); specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }
</script>
