                .from('players')
                .select('active_primary, active_melee')
                .eq('id', currentUserId)
                .single();

            if (data) {
                const primaryMap = {
                    'assault_rifle': 'Rifle',
                    'shotgun': 'Shotgun',
                    'sniper': 'Sniper',
                    'plasma': 'Plasma',
                    'rpg': 'Rocket'

    function startSpawner() {
        if(spawnTimer) spawnTimer.remove();
        spawnTimer = currentScene.time.addEvent({
            delay: spawnRate,
            callback: () => {
                // Check if a wave boss is active. If so, pause spawns!
                if (playerHealth > 0 && !arenaBossActive) {
                    let xPos = Phaser.Math.Between(0, 1) === 0 ? 50 : 750;
                    spawnEnemyAt(xPos, 300);
                    if(spawnRate > 800) spawnRate -= 50; 
                    startSpawner(); 
                }
            }
        });
    }

    // --- MILESTONE BOSS 1: GOLIATH MECH ---
    function spawnGoliathBoss() {
        arenaBossActive = true;
        showCenterMessage("WARNING: GOLIATH MECH", '#ff0000');
        
        // Clear existing grunts for the 1v1
        enemiesGroup.getChildren().forEach(e => { if(!e.enemyData.isBoss) triggerEnemyDeath(e); });

        currentScene.time.delayedCall(2000, () => {
            activeBoss = currentScene.physics.add.sprite(750, 100, 'boss');
            activeBoss.setScale(1.2);
            activeBoss.setFlipX(true);
            activeBoss.body.setCollideWorldBounds(true);
            activeBoss.body.setImmovable(true);
            activeBoss.body.setAllowGravity(true);
            activeBoss.setDepth(15);
            
            // Scaled for Arena
            activeBoss.enemyData = { isBoss: true, bossType: 1, hp: 1000, maxHp: 1000, armor: 400, maxArmor: 400, state: 'active', isStunned: false };
            enemiesGroup.add(activeBoss);
            
            bossAIEvent = currentScene.time.addEvent({ delay: 3000, callback: runGoliathPattern, loop: true });
        });
    }

    function runGoliathPattern() {
        if (!activeBoss || !activeBoss.active || playerHealth <= 0) return;
        let attackType = Phaser.Math.Between(1, 2);
        activeBoss.body.setVelocityX(0); 

        if (attackType === 1) {
            activeBoss.anims.play('boss_shoot', true);
            currentScene.time.delayedCall(400, () => { 
                if(!activeBoss.active) return;
                for (let i = -2; i <= 2; i++) {
                    let bullet = currentScene.add.rectangle(activeBoss.x - 110, activeBoss.y - 20, 20, 20, 0xff5500); 
                    currentScene.physics.add.existing(bullet); 
                    enemyProjectiles.add(bullet); 
                    bullet.body.setAllowGravity(false);
                    
                    let angle = Math.PI + (i * 0.15); 
                    currentScene.physics.velocityFromRotation(angle, 700, bullet.body.velocity);
                    bullet.rotation = angle;
                    bullet.dmg = 20; 
                    
                    currentScene.time.delayedCall(3000, () => { if(bullet.active) bullet.destroy(); });
                }
            });
            currentScene.time.delayedCall(1200, () => { if(activeBoss.active) { activeBoss.anims.play('boss_walk', true); } });
            
        } else {
            activeBoss.anims.play('boss_slam', true); 
            currentScene.time.delayedCall(600, () => { 
                if(!activeBoss.active) return; 
                currentScene.cameras.main.shake(200, 0.01); 
                
                let shockwave = currentScene.add.rectangle(activeBoss.x - 80, 360, 40, 60, 0x00ffff); 
                currentScene.physics.add.existing(shockwave); 
                enemyProjectiles.add(shockwave);
                shockwave.body.setAllowGravity(false);
                shockwave.body.setVelocityX(-500); 
                shockwave.dmg = 35; 
                
                currentScene.time.delayedCall(3000, () => { if(shockwave.active) shockwave.destroy(); });
            });
            currentScene.time.delayedCall(1200, () => { if(activeBoss.active) { activeBoss.anims.play('boss_walk', true); } });
        }
    }

    function executeAttack(step) {
        isAttacking = true; comboStep = step; inputBuffered = false; canCancel = false;
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        
        if (activeWeapon.name === 'Energy Whip') playAnim('whip_stand');

        let currentReach = step === 3 ? activeWeapon.reach * 1.5 : activeWeapon.reach;
        meleeHitbox.width = currentReach; meleeHitbox.height = step === 3 ? 40 : 20; meleeHitbox.setAlpha(0); 
        let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
        meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

        currentScene.time.delayedCall(activeWeapon.speed * 0.5, () => {
            if (activeWeapon.name === 'Energy Whip') { drawWhipFX(false); } 
            else {
                let slashGraphic = currentScene.add.graphics(); slashGraphic.lineStyle(6, activeWeapon.color, 1); slashGraphic.beginPath();
                slashGraphic.arc(player.x, player.y, 30, Phaser.Math.DegToRad(facingDirection === 0 ? -45 : 225), Phaser.Math.DegToRad(facingDirection === 0 ? 45 : 135), false);
                slashGraphic.strokePath(); currentScene.tweens.add({ targets: slashGraphic, alpha: 0, duration: 200, onComplete: () => slashGraphic.destroy() });
            }

            enemiesGroup.getChildren().forEach(enemy => {
                if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), enemy.getBounds()) && enemy.enemyData.state !== 'dead') {
                    dealDamageToEnemy(enemy, activeWeapon.damage * (step === 3 ? 2 : 1), activeWeapon.pierce, activeWeapon.stun);
                    enemy.setTint(activeWeapon.color); currentScene.time.delayedCall(100, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.clearTint(); });
                    if(step === 3 && enemy.active && !enemy.enemyData.isBoss) enemy.body.setVelocityX(facingDirection === 0 ? 150 : -150);
                }
            });
        });

        attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
            meleeHitbox.setPosition(-100, -100); canCancel = true; 
            if (inputBuffered && step < 3) triggerNextHit();
            else { attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * (step === 3 ? 2.5 : 1.5), () => { isAttacking = false; comboStep = 0; inputBuffered = false; canCancel = false; playAnim('unarmed_idle'); }); }

    function triggerNextHit() { if (comboStep < 3) executeAttack(comboStep + 1); }

        playerHealth -= finalDmg; spawnDamageText(player.x, player.y - 30, finalDmg, finalDmg >= 30, true);

    function shootGun(baseAngle) {
        for (let i = 0; i < activeGun.count; i++) {
            let currentAngle = baseAngle + (i - Math.floor(activeGun.count / 2)) * 0.15;

            currentScene.physics.add.existing(bullet); bullet.body.setAllowGravity(false); 
            currentScene.physics.velocityFromRotation(currentAngle, activeGun.speed, bullet.body.velocity); bullet.rotation = currentAngle;
            
            // TRACKING: Shot Fired
            currentMatchShotsFired++;

            currentScene.physics.add.overlap(bullet, enemiesGroup, (b, enemy) => {
                if (enemy.enemyData.state !== 'dead') {
                    b.destroy(); 
                    // TRACKING: Shot Hit
                    currentMatchShotsHit++; 
                    dealDamageToEnemy(enemy, activeGun.damage, 0.20, 0); enemy.setTint(enemy.enemyData.isBoss ? 0xffffff : activeGun.color); 
                    currentScene.time.delayedCall(50, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.clearTint(); });
                }
            });
            currentScene.time.delayedCall(activeGun.lifespan, () => { if(bullet.active) bullet.destroy(); });
        }
    }

    function dealDamageToEnemy(enemy, dmg, piercePercent, stunDuration) {
        if (!enemy.active || enemy.enemyData.state === 'dead') return;
        let data = enemy.enemyData; let piercingDmg = dmg * piercePercent, standardDmg = dmg - piercingDmg;
        if (data.armor > 0) { data.armor -= standardDmg; if (data.armor < 0) { data.hp += data.armor; data.armor = 0; } } else { data.hp -= standardDmg; }
        data.hp -= piercingDmg; spawnDamageText(enemy.x + Phaser.Math.Between(-10, 10), enemy.y - 30, Math.round(dmg), dmg >= 40, false);
        
        if (data.isBoss && data.bossType === 2) {
            enemy.setFrame(1);
            currentScene.time.delayedCall(70, () => { if (enemy.active) enemy.setFrame(0); });
        }

        if (stunDuration > 0 && !data.isBoss) {
            data.isStunned = true; data.state = 'stunned'; enemy.setTint(0x00ffff);
            currentScene.time.delayedCall(stunDuration * 1000, () => { if(enemy.active && data.state !== 'dead') { data.isStunned = false; data.state = 'idle'; enemy.clearTint(); } });
        }

        // --- UPGRADED ECONOMY PAYOUT ---
        if (data.hp <= 0) { 
            let currentCredits = currentScene.registry.get('credits');
            if (data.isBoss) {
                score += 5000; 
                let newBalance = currentCredits + 500; // 500 Credit Boss Bonus
                currentScene.registry.set('credits', newBalance);
                localStorage.setItem('nt_credits', newBalance);
                scoreText.setText('SCORE: ' + score + ' | CREDITS: ' + newBalance);
                
                if (data.bossType === 1) goliathDefeated = true;
                if (data.bossType === 2) siegeTankDefeated = true;
                
                triggerArenaBossDefeat(enemy);
            } else {
                score += 10; 
                let newBalance = currentCredits + 15; // 15 Credit Grunt Bounty
                currentScene.registry.set('credits', newBalance);
                localStorage.setItem('nt_credits', newBalance);
                scoreText.setText('SCORE: ' + score + ' | CREDITS: ' + newBalance);
                triggerEnemyDeath(enemy); 
            }
        }
    }

    function drawFloatingBars() {
        playerHealthBar.clear(); 
        if (playerHealth > 0 && !isSpawning) { playerHealthBar.fillStyle(0x333333, 1).fillRect(player.x - 20, player.y - 40, 40, 5); playerHealthBar.fillStyle(0x00ff00, 1).fillRect(player.x - 20, player.y - 40, 40 * (playerHealth / 100), 5); }
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; 
            if (data.bars && data.state !== 'dead') {
                let bars = data.bars; bars.clear();
                bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 45, 50, 6); bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 36, 50, 6);
                bars.fillStyle(0x00ff00, 1).fillRect(enemy.x - 25, enemy.y - 45, 50 * (data.hp / data.maxHp), 6); bars.fillStyle(0xcccccc, 1).fillRect(enemy.x - 25, enemy.y - 36, 50 * (data.armor / data.maxArmor), 6);
            }
        });
    }

    function update() {
        drawFloatingBars(); let currentTime = currentScene.time.now;

        // --- MILESTONE WAVE TRIGGERS ---
        if (score >= 1000 && !goliathDefeated && !arenaBossActive && !activeBoss) {
            spawnGoliathBoss();
        } else if (score >= 2500 && goliathDefeated && !siegeTankDefeated && !arenaBossActive && !activeBoss) {
            spawnSiegeTankBoss();
        }

        if (!isDashing && !isAttacking && !isBlocking && !isSpawning && playerHealth > 0) {
            player.rotation = 0; 
            
            if (joyStickLeft.left) { player.body.setVelocityX(-250); playAnim('run_normal'); }
            else if (joyStickLeft.right) { player.body.setVelocityX(250); playAnim('run_normal'); }
            else { player.body.setVelocityX(0); playAnim('unarmed_idle'); }
            
            // --- UPGRADED JUMP LOGIC ---
            if (player.body.touching.down || player.body.blocked.down) jumps = 0;

            let shootAngle = facingDirection;
            let nearestEnemy = null;
            let minDist = 600;

            if (isFiring) {
                enemiesGroup.getChildren().forEach(enemy => {
                    if (enemy.active && enemy.enemyData.state !== 'dead' && enemy.y <= 450) {
                        let dist = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
                        if (dist < minDist) { minDist = dist; nearestEnemy = enemy; }
                    }
                });

                if (nearestEnemy) {
                    shootAngle = Phaser.Math.Angle.Between(player.x, player.y, nearestEnemy.x, nearestEnemy.y);
                    facingDirection = (nearestEnemy.x < player.x) ? Math.PI : 0;
                } else {
                    if (joyStickLeft.force > 0) {
                        shootAngle = joyStickLeft.rotation;
                        facingDirection = Math.abs(shootAngle) > Math.PI/2 ? Math.PI : 0;
                    } 
                }
                
                if (currentTime > lastFiredTime + activeGun.fireRate) {
                    shootGun(shootAngle); lastFiredTime = currentTime; 
                }
            } else {
                if (joyStickLeft.left) facingDirection = Math.PI;
                else if (joyStickLeft.right) facingDirection = 0;
            }

            player.setFlipX(facingDirection === Math.PI);

        } else if (isAttacking || isBlocking) { player.body.setVelocityX(0); player.rotation = 0; }
        
        // --- UPGRADED DRONE LOGIC ---
        if (droneActive && drone && playerHealth > 0) {
            let targetX = player.x + (facingDirection === 0 ? -30 : 30);
            let targetY = player.y - 40 + (Math.sin(currentTime / 200) * 8); 
            drone.x = Phaser.Math.Linear(drone.x, targetX, 0.1);
            drone.y = Phaser.Math.Linear(drone.y, targetY, 0.1);

            if (currentTime > lastDroneFire + 300) {
                let nearestEnemy = null;
                let minDist = 500;
                enemiesGroup.getChildren().forEach(enemy => {
                    if (enemy.active && enemy.enemyData.state !== 'dead' && enemy.y <= 450) {
                        let dist = Phaser.Math.Distance.Between(drone.x, drone.y, enemy.x, enemy.y);
                        if (dist < minDist) { minDist = dist; nearestEnemy = enemy; }
                    }
                });

                if (nearestEnemy) {
                    let angle = Phaser.Math.Angle.Between(drone.x, drone.y, nearestEnemy.x, nearestEnemy.y);
                    drone.rotation = angle;
                    
                    let laser = currentScene.add.rectangle(drone.x, drone.y, 10, 3, 0x00ffff);
                    currentScene.physics.add.existing(laser);
                    laser.body.setAllowGravity(false);
                    currentScene.physics.velocityFromRotation(angle, 900, laser.body.velocity);
                    laser.rotation = angle;
                    
                    currentScene.physics.add.overlap(laser, enemiesGroup, (l, enemy) => {
                        if (enemy.enemyData.state !== 'dead') {
                            l.destroy(); 
                            dealDamageToEnemy(enemy, 15, 0.8, 0); 
                            if(!enemy.enemyData.isBoss) {
                                enemy.setTint(0x00ffff); 
                                currentScene.time.delayedCall(50, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.clearTint(); });
                            }
                        }
                    });
                    currentScene.time.delayedCall(1000, () => { if(laser.active) laser.destroy(); });
                    lastDroneFire = currentTime;
                } else {
                    drone.rotation = facingDirection;
                }
            }
        } else if (droneActive && playerHealth <= 0) {
            droneActive = false;
            if(drone) drone.destroy();
        }
        
        // --- UPGRADED GRUNT AI LOOP ---
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; 
            if (data.isBoss) return; 
            if (enemy.y > 450) { if (enemy.active) enemy.destroy(); return; }
            if (data.state === 'dead') return; 

            let distToPlayer = Phaser.Math.Distance.Between(enemy.x, enemy.y, player.x, player.y); 
            let yDistance = Math.abs(player.y - enemy.y);

            // AGGRO UPGRADE: If player is far away, or on a different vertical platform, go idle
            if (distToPlayer > 400 || yDistance > 40) {
                if (data.state !== 'attack' && data.state !== 'shoot') { 
                    data.state = 'idle'; 
                    enemy.body.setVelocityX(0); 
                    if(enemy.active && data.state !== 'dead') enemy.anims.play('grunt_unarmed_idle', true); 
                }
            }
            else if (!data.isStunned && playerHealth > 0 && !isSpawning) {
                if (distToPlayer < 75 && data.canAttack) {
                    data.state = 'attack'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.clearTint();
                    enemy.anims.play('grunt_punch_right', true);

                    currentScene.time.delayedCall(400, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0 || data.state === 'dead') return; 
                        data.hitbox.setPosition(enemy.x + (enemy.x < player.x ? 25 : -25), enemy.y); data.hitbox.setAlpha(1);
                        if (Phaser.Geom.Intersects.RectangleToRectangle(data.hitbox.getBounds(), player.getBounds())) { playerTakeDamage(25, enemy.x); }
                        currentScene.time.delayedCall(150, () => { data.hitbox.setAlpha(0); data.hitbox.setPosition(-100, -100); if (data.state !== 'dead') data.state = 'idle'; });
                    });
                    currentScene.time.delayedCall(2000, () => { data.canAttack = true; });
                    
                } else if (distToPlayer >= 100 && distToPlayer <= 350 && data.canAttack && data.state !== 'attack') {
                    // FASTER SHOOTING COOLDOWN
                    data.state = 'shoot'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.clearTint();
                    
                    let dir = (player.x > enemy.x) ? 1 : -1; 
                    enemy.setFlipX(dir === -1);
                    enemy.anims.play('grunt_punch_left', true);

                    currentScene.time.delayedCall(300, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0 || data.state === 'dead') return; 
                        
                        let enemyBullet = currentScene.add.rectangle(enemy.x + (dir * 25), enemy.y, 10, 4, 0xffaa00);
                        currentScene.physics.add.existing(enemyBullet);
                        
                        enemyProjectiles.add(enemyBullet); 
                        enemyBullet.body.setAllowGravity(false); 
                        
                        enemyBullet.body.setVelocityX(dir * 500); 
                        enemyBullet.dmg = 10;
                        
                        currentScene.time.delayedCall(1500, () => { if(enemyBullet.active) enemyBullet.destroy(); });
                        if (data.state !== 'dead') data.state = 'idle';
                    });
                    
                    currentScene.time.delayedCall(1500, () => { data.canAttack = true; });
                    
                } else if (distToPlayer > 75 && data.state !== 'attack' && data.state !== 'shoot') {
                    data.state = 'chase'; let dir = (player.x > enemy.x) ? 1 : -1; enemy.body.setVelocityX(100 * dir); 
                    enemy.setFlipX(dir === -1);
                    enemy.anims.play('grunt_run_normal', true);

                    if (enemy.body.blocked.left || enemy.body.blocked.right) { if(enemy.body.touching.down) enemy.body.setVelocityY(-400); }
                } else if (data.state !== 'attack' && data.state !== 'shoot') { 
                    data.state = 'idle'; enemy.body.setVelocityX(0); 
                    enemy.anims.play('grunt_unarmed_idle', true);
                }
            } else { 
                if (data.state !== 'attack' && data.state !== 'shoot') { 
                    enemy.body.setVelocityX(0); 
                    if(enemy.active && data.state !== 'dead') enemy.anims.play('grunt_unarmed_idle', true); 
                } 
            }
        });

        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(750, 210, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false); specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }

    // --- SUPABASE DATA TRANSMISSION FUNCTION ---
    async function sendMatchResults(matchData) {
        const { data, error } = await supabase.rpc('process_match_results', {
            p_player_id: matchData.playerId,
            p_kills: matchData.kills,
            p_shots_fired: matchData.shotsFired,
            p_shots_hit: matchData.shotsHit,
            p_veteran_takedowns: matchData.veteranTakedowns,
            p_placed_bottom_half: matchData.placedBottomHalf
        });

        if (error) {
            console.error('Match stats processing failed:', error.message);
            return;
        }

        console.log('Match Processed Successfully:', data);
    }

    // --- GLOBAL HTML PAUSE CONTROLLER ---
    let isGamePaused = false;
    document.getElementById('pauseBtn').addEventListener('click', () => {
        if (!isGamePaused) {
            game.scene.scenes[0].scene.pause();
            isGamePaused = true;
            document.getElementById('pauseBtn').innerText = 'RESUME';
            document.getElementById('pauseBtn').style.background = '#00aaff';
            document.getElementById('pauseBtn').style.color = '#000';
        } else {
            game.scene.scenes[0].scene.resume();
            isGamePaused = false;
            document.getElementById('pauseBtn').innerText = 'PAUSE';
            document.getElementById('pauseBtn').style.background = '#333';
            document.getElementById('pauseBtn').style.color = '#fff';
        }
    });
</script>

</body>
