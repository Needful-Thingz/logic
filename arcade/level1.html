<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Needful Thingz - Level 1: Overgrown Facility (Boss Fight)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121a12; overflow: hidden; } 
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 400 },
        physics: { default: 'arcade', arcade: { gravity: { y: 800 }, debug: false } },
        scene: { preload: preload, create: create, update: update },
        backgroundColor: '#121a12' 
    };

    const game = new Phaser.Game(config);
    
    // Core Entities
    let player, joyStickLeft, joyStickRight, platforms;
    let uiElements = []; 
    let meleeText, gunText, ammoText, grenadeText, actionText, rosterText, scoreText, centerMsgText;
    let facingDirection = 0, currentScene, grenadesGroup; 
    let score = 0;
    
    // --- ARMORY DATA ---
    const weaponArmory = {
        'Knife': { name: 'Combat Knife', damage: 28, reach: 40, pierce: 0.15, stun: 0, speed: 80, color: 0xcccccc },
        'Sword': { name: 'Broadsword', damage: 35, reach: 75, pierce: 0.50, stun: 0, speed: 150, color: 0xff3333 },
        'Whip':  { name: 'Energy Whip',  damage: 12, reach: 170, pierce: 0.90, stun: 1.0, speed: 250, color: 0x00ffff }
    };
    let weaponKeys = ['Knife', 'Sword', 'Whip'];
    
    const gunArmory = {
        'Pistol':   { name: 'Service Pistol', damage: 15, fireRate: 300, speed: 900, count: 1, color: 0xcccccc, lifespan: 1000, clipSize: 12, reloadTime: 1000 },
        'Shotgun':  { name: 'Pump Shotgun',   damage: 10, fireRate: 800, speed: 600, count: 5, color: 0xffaa00, lifespan: 300,  clipSize: 6,  reloadTime: 3000 }, 
        'Rifle':    { name: 'Assault Rifle',  damage: 8,  fireRate: 100, speed: 1200,count: 1, color: 0x00ff00, lifespan: 800,  clipSize: 30, reloadTime: 1200 },
        'Sniper':   { name: 'Heavy Sniper',   damage: 60, fireRate: 1200,speed: 2000,count: 1, color: 0xff00ff, lifespan: 1500, clipSize: 5,  reloadTime: 2500 },
        'GrenadeL': { name: 'Grenade Tube',   damage: 45, fireRate: 800, speed: 500, count: 1, color: 0xff5500, lifespan: 1200, clipSize: 4,  reloadTime: 2200 },
        'Rocket':   { name: 'RPG Launcher',   damage: 90, fireRate: 1000,speed: 900, count: 1, color: 0xff0000, lifespan: 2000, clipSize: 1,  reloadTime: 3000 }
    };
    let gunKeys = ['Pistol', 'Shotgun', 'Rifle', 'Sniper', 'GrenadeL', 'Rocket'];
    
    const ordnanceArmory = { 'Frag': { name: 'Frag Grenade', damage: 50, radius: 110, fuse: 1500, maxAmmo: 3, cooldown: 1000, color: 0x00ff00 } };
    let activeOrdnance = ordnanceArmory['Frag'];

    // --- ROSTER MANAGER (Linked to Hangar) ---
    let savedRoster = localStorage.getItem('nt_roster');
    const playerRoster = savedRoster ? JSON.parse(savedRoster) : [
        { name: "Vanguard", color: 0x00aaff, melee: 'Sword', gun: 'Shotgun' },
        { name: "Recon",    color: 0xaaaa00, melee: 'Knife', gun: 'Rifle' },
        { name: "Heavy",    color: 0xaa00ff, melee: 'Whip',  gun: 'Rocket' }
    ];
    
    let currentRosterIndex = 0, activeCharDef = playerRoster[currentRosterIndex];
    let playerHealth = 100, jumps = 0, joystickUpReleased = true, playerHealthBar; 
    let currentWeaponIndex = 0, activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife'];
    let currentGunIndex = 1, activeGun = gunArmory[activeCharDef.gun] || gunArmory['Shotgun'];
    let lastFiredTime = 0, currentAmmo = activeGun.clipSize, isReloading = false, reloadTimer;
    let currentOrdnanceAmmo = 3, lastTossedTime = 0;
    
    // --- COMBAT FLAGS ---
    let specialCharge = 0, specialReady = false, meleeHitbox;
    const specialMax = 100;
    let specialButton, specialGraphics;
    let comboStep = 0, isAttacking = false, inputBuffered = false, canCancel = false;
    let attackActiveTimer, attackRecoveryTimer;
    let isBlocking = false, isDashing = false, canDash = true, isInvincible = false, isSpawning = false;
    
    // --- LEVEL & BOSS VARS ---
    let enemiesGroup;
    let enemyProjectiles;
    const WORLD_WIDTH = 3200; 
    
    let boss, bossActive = false, bossDefeated = false;
    let bossHpBar, bossWall;
    let bossAIEvent;
    
    function preload() {
        this.load.plugin('rexvirtualjoystickplugin', 'https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js', true);
    }

    function create() {
        currentScene = this; 
        
        this.physics.world.setBounds(0, 0, WORLD_WIDTH, 400);
        this.cameras.main.setBounds(0, 0, WORLD_WIDTH, 400);

        grenadesGroup = this.physics.add.group(); 
        enemiesGroup = this.physics.add.group();
        enemyProjectiles = this.physics.add.group();
        platforms = this.physics.add.staticGroup();

        // --- LEVEL DESIGN ---
        platforms.add(this.add.rectangle(400, 390, 800, 20, 0x2d382d)); 
        platforms.add(this.add.rectangle(600, 300, 150, 15, 0x4a544a)); 
        platforms.add(this.add.rectangle(1050, 250, 200, 15, 0x4a544a)); 
        platforms.add(this.add.rectangle(1350, 390, 400, 20, 0x2d382d)); 
        platforms.add(this.add.rectangle(1350, 180, 200, 15, 0x4a544a)); 
        platforms.add(this.add.rectangle(1900, 390, 500, 20, 0x2d382d)); 
        platforms.add(this.add.rectangle(1800, 280, 150, 15, 0x4a544a));
        platforms.add(this.add.rectangle(2000, 220, 150, 15, 0x4a544a));
        
        // Boss Arena
        platforms.add(this.add.rectangle(2800, 390, 800, 20, 0x2d382d)); 
        platforms.add(this.add.rectangle(2650, 260, 150, 15, 0x4a544a));
        platforms.add(this.add.rectangle(2950, 260, 150, 15, 0x4a544a));

        bossWall = this.add.rectangle(2400, 200, 20, 400, 0x00ffff, 0.4);
        this.physics.add.existing(bossWall, true);
        bossWall.body.checkCollision.none = true; 

        spawnEnemyAt(700, 200); spawnEnemyAt(1050, 150); spawnEnemyAt(1350, 100);
        spawnEnemyAt(1450, 300); spawnEnemyAt(1800, 200); spawnEnemyAt(2100, 300);

        // --- GOLIATH BOSS SETUP ---
        boss = this.add.rectangle(3100, 300, 80, 150, 0x444444); 
        this.physics.add.existing(boss);
        boss.body.setCollideWorldBounds(true);
        boss.body.setImmovable(true);
        boss.body.setAllowGravity(false); 
        boss.setDepth(5);
        
        boss.enemyData = {
            isBoss: true, hp: 500, maxHp: 500, armor: 200, maxArmor: 200,
            state: 'sleep', isStunned: false
        };
        enemiesGroup.add(boss);

        // Player Setup
        player = this.add.rectangle(100, 200, 30, 50, activeCharDef.color);
        this.physics.add.existing(player); 
        player.body.setCollideWorldBounds(true);
        this.cameras.main.startFollow(player, true, 0.1, 0.1);

        meleeHitbox = this.add.rectangle(-100, -100, 40, 20, 0xffffff).setAlpha(0);
        this.physics.add.existing(meleeHitbox); meleeHitbox.body.setAllowGravity(false);

        playerHealthBar = this.add.graphics().setDepth(10);
        bossHpBar = this.add.graphics().setScrollFactor(0).setDepth(20);

        this.physics.add.collider(player, platforms);
        this.physics.add.collider(player, bossWall); 
        this.physics.add.collider(enemiesGroup, platforms); 
        this.physics.add.collider(grenadesGroup, platforms);
        
        this.physics.add.overlap(player, enemyProjectiles, (p, proj) => {
            proj.destroy();
            playerTakeDamage(proj.dmg, proj.x);
        });

        // --- UI SETUP ---
        meleeText = this.add.text(10, 10, 'Melee: ', { fontSize: '12px', fill: '#ffffff' }); uiElements.push(meleeText);
        gunText = this.add.text(10, 25, 'Gun: ', { fontSize: '12px', fill: '#ffff00' }); uiElements.push(gunText);
        ammoText = this.add.text(10, 40, `Ammo: `, { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold' }); uiElements.push(ammoText);
        grenadeText = this.add.text(10, 60, `Nades: `, { fontSize: '14px', fill: '#00ff00', fontStyle: 'bold' }); uiElements.push(grenadeText);
        actionText = this.add.text(400, 20, 'Ready', { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(actionText);
        rosterText = this.add.text(400, 40, 'TEAM: 3 LIVES', { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(rosterText);
        scoreText = this.add.text(400, 65, 'SCORE: 0', { fontSize: '22px', fill: '#ffaa00', fontStyle: 'bold' }).setOrigin(0.5); uiElements.push(scoreText);
        
        centerMsgText = this.add.text(400, 150, '', { fontSize: '32px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setAlpha(0);
        uiElements.push(centerMsgText);

        joyStickLeft = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 120, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xcccccc).setAlpha(0.5), dir: '8dir', forceMin: 16 });
        const leftTapZone = this.add.circle(120, 300, 25, 0xffffff, 0).setInteractive(); uiElements.push(leftTapZone);
        leftTapZone.on('pointerdown', () => { if (!isAttacking && !isBlocking && !isDashing && jumps < 3 && !isSpawning) { player.body.setVelocityY(-450); jumps++; actionText.setText('Triple Jump: ' + jumps + '/3'); } });
        joyStickRight = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 680, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xff0000).setAlpha(0.5), dir: '8dir', forceMin: 16 });

        const btnMelee = this.add.circle(570, 310, 25, 0xffaa00).setAlpha(0.6).setInteractive(); uiElements.push(btnMelee);
        const btnMeleeT = this.add.text(554, 302, 'HIT', { fontSize: '14px', fill: '#000', fontStyle: 'bold' }); uiElements.push(btnMeleeT);
        btnMelee.on('pointerdown', () => { if (isBlocking || isDashing || isSpawning) return; if (!isAttacking) executeAttack(1); else { inputBuffered = true; if (canCancel && comboStep < 3) triggerNextHit(); } });

        const btnHeavy = this.add.circle(570, 250, 25, 0xff3300).setAlpha(0.7).setInteractive(); uiElements.push(btnHeavy);
        const btnHeavyT = this.add.text(554, 242, 'HVY', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }); uiElements.push(btnHeavyT);
        btnHeavy.on('pointerdown', () => { if (!isBlocking && !isDashing && !isAttacking && !isSpawning) executeHeavyAttack(); });

        const btnToss = this.add.circle(510, 250, 25, 0x00cc00).setAlpha(0.6).setInteractive(); uiElements.push(btnToss);
        const btnTossT = this.add.text(492, 242, 'TOSS', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }); uiElements.push(btnTossT);
        btnToss.on('pointerdown', tossGrenade);

        const btnDefend = this.add.circle(510, 310, 25, 0x888888).setAlpha(0.8).setInteractive(); uiElements.push(btnDefend);
        const btnDefendT = this.add.text(495, 302, 'DEF', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }); uiElements.push(btnDefendT);
        btnDefend.on('pointerdown', () => {
            if (isAttacking || isDashing || isSpawning) return;
            if (joyStickLeft.left || joyStickLeft.right) { if (canDash) executeDash(); } 
            else { isBlocking = true; player.fillColor = 0xcccccc; actionText.setText('BLOCKING'); }
        });
        btnDefend.on('pointerup', releaseBlock); btnDefend.on('pointerout', releaseBlock);
        function releaseBlock() { if (isBlocking) { isBlocking = false; player.fillColor = activeCharDef.color; actionText.setText('Ready'); } }

        const btnReload = this.add.circle(450, 310, 25, 0x4444ff).setAlpha(0.7).setInteractive(); uiElements.push(btnReload);
        const btnReloadT = this.add.text(435, 302, 'RLD', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }); uiElements.push(btnReloadT);
        btnReload.on('pointerdown', () => { if (!isReloading && !isAttacking && !isBlocking && !isDashing && !isSpawning && currentAmmo < activeGun.clipSize) reloadGun(); });

        specialButton = this.add.circle(680, 180, 30, 0x555555).setAlpha(0.7).setInteractive(); uiElements.push(specialButton);
        const specialButtonT = this.add.text(660, 172, 'ULT', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' }); uiElements.push(specialButtonT);
        specialGraphics = this.add.graphics(); uiElements.push(specialGraphics);
        
        specialButton.on('pointerdown', () => {
            if (specialReady && !isAttacking && !isBlocking && !isSpawning) {
                player.fillColor = 0x00ffff;
                enemiesGroup.getChildren().forEach(enemy => {
                    if (Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y) < 250) { 
                        dealDamageToEnemy(enemy, 50, 0.8, 0); enemy.fillColor = 0x00ffff; this.time.delayedCall(200, () => { if(enemy.active) enemy.fillColor = enemy.enemyData.isBoss ? 0x444444 : 0xff5555; }); 
                    }
                });
                this.time.delayedCall(500, () => player.fillColor = activeCharDef.color);
                specialCharge = 0; specialReady = false; specialButton.setFillStyle(0x555555); specialGraphics.clear();
            }
        });

        uiElements.forEach(el => {
            if (el.setScrollFactor) el.setScrollFactor(0);
        });
        joyStickLeft.base.setScrollFactor(0); joyStickLeft.thumb.setScrollFactor(0);
        joyStickRight.base.setScrollFactor(0); joyStickRight.thumb.setScrollFactor(0);
        
        applyCharacterLoadout();
    }

    // --- BOSS AI LOGIC ---
    function triggerBoss() {
        bossActive = true;
        boss.enemyData.state = 'active';
        
        currentScene.cameras.main.stopFollow();
        currentScene.cameras.main.pan(2800, 200, 1000, 'Sine.easeInOut');
        
        currentScene.time.delayedCall(1000, () => {
            currentScene.cameras.main.setBounds(2400, 0, 800, 400);
            bossWall.body.checkCollision.none = false; 
            
            showCenterMessage("WARNING: GOLIATH MECH", '#ff0000');
            
            bossAIEvent = currentScene.time.addEvent({ delay: 3000, callback: runBossPattern, loop: true });
        });
    }

    function runBossPattern() {
        if (!boss.active || bossDefeated || playerHealth <= 0) return;
        
        let attackType = Phaser.Math.Between(1, 2);
        
        if (attackType === 1) {
            boss.fillColor = 0xffff00; 
            currentScene.time.delayedCall(500, () => {
                if(!boss.active) return;
                boss.fillColor = 0x444444;
                for (let i = 0; i < 5; i++) {
                    currentScene.time.delayedCall(i * 150, () => {
                        let bullet = currentScene.add.rectangle(boss.x - 50, 360, 16, 6, 0xffff00);
                        currentScene.physics.add.existing(bullet); bullet.body.setAllowGravity(false);
                        bullet.body.setVelocityX(-500);
                        bullet.dmg = 15;
                        enemyProjectiles.add(bullet);
                        currentScene.time.delayedCall(2000, () => { if(bullet.active) bullet.destroy(); });
                    });
                }
            });
        } else {
            boss.fillColor = 0xffffff; 
            let targetX = player.x;
            
            let reticle = currentScene.add.circle(targetX, 380, 60, 0xff0000, 0.4);
            currentScene.tweens.add({ targets: reticle, alpha: 0.8, duration: 800, yoyo: true, repeat: 0 });
            
            currentScene.time.delayedCall(1000, () => {
                if(!boss.active) return;
                boss.fillColor = 0x444444;
                reticle.destroy();
                
                let explosion = currentScene.add.circle(targetX, 380, 70, 0xff7700, 0.8);
                currentScene.physics.add.existing(explosion); explosion.body.setAllowGravity(false);
                
                if (Phaser.Geom.Intersects.RectangleToRectangle(explosion.getBounds(), player.getBounds())) {
                    playerTakeDamage(40, boss.x);
                }
                
                currentScene.tweens.add({ targets: explosion, alpha: 0, duration: 300, onComplete: () => explosion.destroy() });
            });
        }
    }

    function showCenterMessage(text, color) {
        centerMsgText.setText(text);
        centerMsgText.setFill(color);
        centerMsgText.setAlpha(1);
        currentScene.tweens.add({ targets: centerMsgText, alpha: 0, delay: 2000, duration: 1000 });
    }

    // --- STANDARD LOGIC ---
    function spawnEnemyAt(x, y) {
        let enemy = currentScene.add.rectangle(x, y, 30, 50, 0xff5555);
        currentScene.physics.add.existing(enemy); enemy.body.setCollideWorldBounds(true);
        let hitbox = currentScene.add.rectangle(-100, -100, 30, 30, 0xffffff).setAlpha(0);
        currentScene.physics.add.existing(hitbox); hitbox.body.setAllowGravity(false);
        let barGraphics = currentScene.add.graphics().setDepth(10);
        
        enemy.enemyData = {
            isBoss: false, hp: 60, maxHp: 60, armor: 20, maxArmor: 20, state: 'idle', canAttack: true, isStunned: false,
            hitbox: hitbox, bars: barGraphics
        };
        enemiesGroup.add(enemy);
    }

    function applyCharacterLoadout() {
        activeCharDef = playerRoster[currentRosterIndex]; player.fillColor = activeCharDef.color;
        currentWeaponIndex = weaponKeys.indexOf(activeCharDef.melee); activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife'];
        currentGunIndex = gunKeys.indexOf(activeCharDef.gun); activeGun = gunArmory[activeCharDef.gun] || gunArmory['Shotgun'];
        playerHealth = 100; currentAmmo = activeGun.clipSize; currentOrdnanceAmmo = activeOrdnance.maxAmmo;
        isReloading = false; isSpawning = false;
        meleeText.setText('Melee: ' + activeWeapon.name); gunText.setText('Gun: ' + activeGun.name);
        rosterText.setText(`TEAM: ${3 - currentRosterIndex} LIVES`); actionText.setText(`${activeCharDef.name} DROPS IN!`); updateUI();
    }

    function spawnNextCharacter() {
        if (currentRosterIndex >= 3) return; 
        isSpawning = true; isInvincible = true;
        player.x = currentScene.cameras.main.scrollX + 100; 
        player.y = -50; player.body.setVelocityY(800); 
        applyCharacterLoadout();
        player.setAlpha(0.5);
        currentScene.time.delayedCall(1500, () => { isInvincible = false; player.setAlpha(1); actionText.setText('Ready'); });
    }

    function resetEntireMatch() {
        currentRosterIndex = 0; score = 0; bossActive = false; bossDefeated = false;
        currentScene.scene.restart(); 
    }

    function spawnDamageText(x, y, amount, isCritical = false, isPlayerHit = false) {
        let fontSize = isCritical ? '26px' : '16px'; let color = isPlayerHit ? '#ff3333' : '#ffdd00'; 
        let floatText = currentScene.add.text(x, y, Math.round(amount).toString(), { fontSize: fontSize, fill: color, fontStyle: 'bold', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5);
        currentScene.tweens.add({ targets: floatText, x: floatText.x + Phaser.Math.Between(-25, 25), y: floatText.y - 60, alpha: 0, duration: 900, ease: 'Cubic.easeOut', onComplete: () => floatText.destroy() });
    }

    function executeHeavyAttack() {
        isAttacking = true; inputBuffered = false; canCancel = false; 
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        player.fillColor = 0xff5500; actionText.setText(`WINDUP: ${activeWeapon.name}!`);
        currentScene.time.delayedCall(activeWeapon.speed * 1.5, () => {
            player.fillColor = activeWeapon.color; actionText.setText(`HEAVY STRIKE!`);
            let currentReach = activeWeapon.reach * 1.8; meleeHitbox.width = currentReach; meleeHitbox.height = 40; meleeHitbox.setAlpha(1);
            let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
            meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

            enemiesGroup.getChildren().forEach(enemy => {
                if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), enemy.getBounds())) {
                    let heavyStun = activeWeapon.stun > 0 ? activeWeapon.stun * 2 : 0.5;
                    dealDamageToEnemy(enemy, activeWeapon.damage * 2.5, activeWeapon.pierce, heavyStun);
                    enemy.fillColor = activeWeapon.color; currentScene.time.delayedCall(100, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = enemy.enemyData.isBoss ? 0x444444 : 0xff5555; });
                    if(enemy.active && !enemy.enemyData.isBoss) enemy.body.setVelocityX(facingDirection === 0 ? 300 : -300);
                }
            });

            attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
                meleeHitbox.setAlpha(0); meleeHitbox.setPosition(-100, -100); 
                attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * 2.5, () => { isAttacking = false; player.fillColor = activeCharDef.color; actionText.setText('Ready'); });
            });
        });
    }

    function executeAttack(step) {
        isAttacking = true; comboStep = step; inputBuffered = false; canCancel = false;
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        player.fillColor = activeWeapon.color;
        let currentReach = step === 3 ? activeWeapon.reach * 1.5 : activeWeapon.reach;
        meleeHitbox.width = currentReach; meleeHitbox.height = step === 3 ? 40 : 20; meleeHitbox.setAlpha(1);
        let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
        meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

        enemiesGroup.getChildren().forEach(enemy => {
            if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), enemy.getBounds())) {
                dealDamageToEnemy(enemy, activeWeapon.damage * (step === 3 ? 2 : 1), activeWeapon.pierce, activeWeapon.stun);
                enemy.fillColor = activeWeapon.color; currentScene.time.delayedCall(100, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = enemy.enemyData.isBoss ? 0x444444 : 0xff5555; });
                if(step === 3 && enemy.active && !enemy.enemyData.isBoss) enemy.body.setVelocityX(facingDirection === 0 ? 150 : -150);
            }
        });

        attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
            meleeHitbox.setAlpha(0); meleeHitbox.setPosition(-100, -100); canCancel = true; 
            if (inputBuffered && step < 3) triggerNextHit();
            else { attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * (step === 3 ? 2.5 : 1.5), () => { isAttacking = false; comboStep = 0; inputBuffered = false; canCancel = false; player.fillColor = activeCharDef.color; }); }
        });
    }
    function triggerNextHit() { if (comboStep < 3) executeAttack(comboStep + 1); }

    function executeDash() {
        isDashing = true; canDash = false; isInvincible = true; actionText.setText('DODGE!');
        player.setAlpha(0.5); player.fillColor = 0x00ffff; player.body.setVelocityX((facingDirection === 0) ? 700 : -700);
        currentScene.time.delayedCall(250, () => { isDashing = false; isInvincible = false; player.setAlpha(1); player.fillColor = activeCharDef.color; actionText.setText('Ready'); });
        currentScene.time.delayedCall(1200, () => { canDash = true; });
    }

    function playerTakeDamage(incomingDmg, attackXLocation) {
        if (isInvincible || playerHealth <= 0) return; 
        let finalDmg = incomingDmg;
        if (isBlocking) {
            let playerFacingRight = (facingDirection === 0), attackFromRight = (attackXLocation > player.x);
            if ((playerFacingRight && attackFromRight) || (!playerFacingRight && !attackFromRight)) finalDmg *= 0.2; 
        }
        playerHealth -= finalDmg; spawnDamageText(player.x, player.y - 30, finalDmg, finalDmg >= 30, true);
        
        if (playerHealth <= 0) { 
            playerHealth = 0; currentRosterIndex++;
            if (currentRosterIndex < playerRoster.length) spawnNextCharacter();
            else {
                player.setAlpha(0); actionText.setText('TEAM WIPED! Resetting...'); rosterText.setText('TEAM: 0 LIVES');
                if(bossAIEvent) bossAIEvent.remove();
                currentScene.time.delayedCall(3000, resetEntireMatch);
            }
        } 
    }

    function tossGrenade() {
        if (currentOrdnanceAmmo <= 0 || isAttacking || isBlocking || isDashing || isSpawning || currentScene.time.now < lastTossedTime + activeOrdnance.cooldown) return;
        currentOrdnanceAmmo--; updateUI(); lastTossedTime = currentScene.time.now; actionText.setText("TOSS!");
        let nade = currentScene.add.circle(player.x, player.y - 10, 6, activeOrdnance.color);
        currentScene.physics.add.existing(nade); nade.body.setBounce(0.6); nade.body.setDrag(100, 0); nade.body.setCollideWorldBounds(true);
        grenadesGroup.add(nade); nade.body.setVelocity((facingDirection === 0) ? 350 : -350, -400);
        currentScene.time.delayedCall(activeOrdnance.fuse, () => explodeGrenade(nade));
    }
    
    function explodeGrenade(nade) {
        let exX = nade.x, exY = nade.y; nade.destroy();
        let blastVisual = currentScene.add.circle(exX, exY, activeOrdnance.radius, 0xff7700, 0.7);
        enemiesGroup.getChildren().forEach(enemy => {
            if (Phaser.Math.Distance.Between(exX, exY, enemy.x, enemy.y) <= activeOrdnance.radius) {
                dealDamageToEnemy(enemy, activeOrdnance.damage, 0.5, 0); enemy.fillColor = 0xff7700;
                currentScene.time.delayedCall(150, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = enemy.enemyData.isBoss ? 0x444444 : 0xff5555; });
            }
        });
        currentScene.tweens.add({ targets: blastVisual, alpha: 0, duration: 250, onComplete: () => blastVisual.destroy() });
    }

    function reloadGun() {
        isReloading = true; actionText.setText(`Reloading...`); ammoText.setText('RELOADING...'); ammoText.setFill('#ff0000'); 
        reloadTimer = currentScene.time.delayedCall(activeGun.reloadTime, () => { currentAmmo = activeGun.clipSize; isReloading = false; updateUI(); actionText.setText('Ready'); });
    }

    function updateUI() {
        ammoText.setText(`Ammo: ${currentAmmo} / ${activeGun.clipSize}`);
        if (currentAmmo === 0) ammoText.setFill('#ff0000'); else if (currentAmmo <= activeGun.clipSize * 0.25) ammoText.setFill('#ffaa00'); else ammoText.setFill('#00ffff'); 
        grenadeText.setText(`Nades: ${currentOrdnanceAmmo} / ${activeOrdnance.maxAmmo}`);
        if (currentOrdnanceAmmo === 0) grenadeText.setFill('#ff0000'); else grenadeText.setFill('#00ff00');
    }

    function shootGun(baseAngle) {
        for (let i = 0; i < activeGun.count; i++) {
            let currentAngle = baseAngle + (i - Math.floor(activeGun.count / 2)) * 0.15;
            let bullet = currentScene.add.rectangle(player.x, player.y, 12, 4, activeGun.color);
            currentScene.physics.add.existing(bullet); bullet.body.setAllowGravity(false); 
            currentScene.physics.velocityFromRotation(currentAngle, activeGun.speed, bullet.body.velocity); bullet.rotation = currentAngle;
            
            currentScene.physics.add.overlap(bullet, enemiesGroup, (b, enemy) => {
                b.destroy(); dealDamageToEnemy(enemy, activeGun.damage, 0.20, 0); enemy.fillColor = activeGun.color; 
                currentScene.time.delayedCall(50, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.fillColor = enemy.enemyData.isBoss ? 0x444444 : 0xff5555; });
            });
            currentScene.time.delayedCall(activeGun.lifespan, () => { if(bullet.active) bullet.destroy(); });
        }
    }

    function destroyEnemy(enemy) {
        if (!enemy.active) return;
        if (enemy.enemyData.bars) enemy.enemyData.bars.destroy();
        if (enemy.enemyData.hitbox) enemy.enemyData.hitbox.destroy();
        
        if (enemy.enemyData.isBoss) {
            bossDefeated = true;
            bossHpBar.clear();
            if(bossAIEvent) bossAIEvent.remove();
            showCenterMessage("SECTOR CLEARED!", '#00ff00');
            bossWall.body.checkCollision.none = true;
            bossWall.setAlpha(0);
        }
        
        enemy.destroy();
    }

    function dealDamageToEnemy(enemy, dmg, piercePercent, stunDuration) {
        if (!enemy.active) return;
        let data = enemy.enemyData;
        let piercingDmg = dmg * piercePercent, standardDmg = dmg - piercingDmg;
        
        if (data.armor > 0) { data.armor -= standardDmg; if (data.armor < 0) { data.hp += data.armor; data.armor = 0; } } 
        else { data.hp -= standardDmg; }
        
        data.hp -= piercingDmg; 
        spawnDamageText(enemy.x + Phaser.Math.Between(-10, 10), enemy.y - 30, Math.round(dmg), dmg >= 40, false);
        
        if (stunDuration > 0 && !data.isBoss) {
            data.isStunned = true; data.state = 'stunned'; enemy.fillColor = 0x00ffff;
            currentScene.time.delayedCall(stunDuration * 1000, () => { if(enemy.active) { data.isStunned = false; data.state = 'idle'; enemy.fillColor = 0xff5555; } });
        }

        if (data.hp <= 0) { 
            score += data.isBoss ? 1000 : 10; scoreText.setText('SCORE: ' + score);
            destroyEnemy(enemy); 
        }
    }

    function drawFloatingBars() {
        playerHealthBar.clear(); 
        if (playerHealth > 0 && !isSpawning) {
            playerHealthBar.fillStyle(0x333333, 1).fillRect(player.x - 20, player.y - 40, 40, 5); 
            playerHealthBar.fillStyle(0x00ff00, 1).fillRect(player.x - 20, player.y - 40, 40 * (playerHealth / 100), 5); 
        }
        
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; 
            if (!data.isBoss && data.bars) {
                let bars = data.bars; bars.clear();
                bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 45, 50, 6); bars.fillStyle(0x333333, 1).fillRect(enemy.x - 25, enemy.y - 36, 50, 6);
                bars.fillStyle(0x00ff00, 1).fillRect(enemy.x - 25, enemy.y - 45, 50 * (data.hp / data.maxHp), 6); 
                bars.fillStyle(0xcccccc, 1).fillRect(enemy.x - 25, enemy.y - 36, 50 * (data.armor / data.maxArmor), 6);
            }
        });
        
        if (bossActive && !bossDefeated && boss.active) {
            bossHpBar.clear();
            let data = boss.enemyData;
            bossHpBar.fillStyle(0x333333, 1).fillRect(200, 30, 400, 12);
            bossHpBar.fillStyle(0x333333, 1).fillRect(200, 45, 400, 12);
            bossHpBar.fillStyle(0xff0000, 1).fillRect(200, 30, 400 * (data.hp / data.maxHp), 12);
            bossHpBar.fillStyle(0xcccccc, 1).fillRect(200, 45, 400 * (data.armor / data.maxArmor), 12);
        }
    }

    function update() {
        drawFloatingBars();
        let currentTime = currentScene.time.now;
        
        if (!bossActive && player.x > 2600) triggerBoss();

        if (player.y > 395 && playerHealth > 0 && !isSpawning) playerTakeDamage(1000, player.x); 

        // Player Logic
        if (!isDashing && !isAttacking && !isBlocking && !isSpawning && playerHealth > 0) {
            if (joyStickLeft.left) { player.body.setVelocityX(-250); facingDirection = Math.PI; }
            else if (joyStickLeft.right) { player.body.setVelocityX(250); facingDirection = 0; }
            else player.body.setVelocityX(0);
            
            if (joyStickLeft.up && joystickUpReleased && jumps < 3) { player.body.setVelocityY(-450); jumps++; joystickUpReleased = false; }
            else if (!joyStickLeft.up) joystickUpReleased = true;

            if (joyStickRight.force > 0) {
                player.rotation = joyStickRight.rotation; facingDirection = joyStickRight.rotation; 
                if (currentTime > lastFiredTime + activeGun.fireRate && !isReloading) {
                    if (currentAmmo > 0) { shootGun(joyStickRight.rotation); currentAmmo--; updateUI(); lastFiredTime = currentTime; } else reloadGun();
                }
            } else player.rotation = facingDirection; 
        } else if (isAttacking || isBlocking) { player.body.setVelocityX(0); }
        if (player.body.touching.down) jumps = 0;

        // Enemies Loop
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData;
            if (data.isBoss) return; 
            
            if (enemy.y > 395) { destroyEnemy(enemy); return; }

            let distToPlayer = Phaser.Math.Distance.Between(enemy.x, enemy.y, player.x, player.y);
            if (distToPlayer > 800) return; 

            if (!data.isStunned && playerHealth > 0 && !isSpawning) {
                if (distToPlayer < 65 && data.canAttack) {
                    data.state = 'attack'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.fillColor = 0xffffff;
                    
                    currentScene.time.delayedCall(400, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0) return; 
                        enemy.fillColor = 0xff5555;
                        data.hitbox.setPosition(enemy.x + (enemy.x < player.x ? 25 : -25), enemy.y); data.hitbox.setAlpha(1);
                        
                        if (Phaser.Geom.Intersects.RectangleToRectangle(data.hitbox.getBounds(), player.getBounds())) {
                            playerTakeDamage(25, enemy.x); 
                        }
                        currentScene.time.delayedCall(150, () => { data.hitbox.setAlpha(0); data.hitbox.setPosition(-100, -100); data.state = 'idle'; });
                    });
                    currentScene.time.delayedCall(2000, () => { data.canAttack = true; });

                } else if (distToPlayer < 400 && distToPlayer >= 65 && data.state !== 'attack') {
                    data.state = 'chase'; let dir = (player.x > enemy.x) ? 1 : -1; enemy.body.setVelocityX(100 * dir); 
                    if (enemy.body.blocked.left || enemy.body.blocked.right) { if(enemy.body.touching.down) enemy.body.setVelocityY(-400); }
                } else if (data.state !== 'attack') {
                    data.state = 'idle'; enemy.body.setVelocityX(0);
                }
            } else { if (data.state !== 'attack') enemy.body.setVelocityX(0); }
        });

        // Special Attack Charge
        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(680, 180, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false);
            specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }
</script>
