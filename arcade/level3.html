<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Needful Thingz - Level 3: The Assembly Line</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a0a05; overflow: hidden; } 
        
        canvas { display: block; margin: 0 auto; position: relative; z-index: 10; }
        
        #bossGif {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            object-fit: contain; 
            pointer-events: none; 
            display: none; 
            z-index: 1; 
        }
    </style>
</head>
<body>

<!-- Cache-buster v13 for the HTML layout -->
<img id="bossGif" src="assets/boss_lvl3.gif?v=13" alt="Foundry Boss">

<script>

    let bg1Tile, bg2Tile, bg3Tile, arenaBg;

    };

    const gunArmory = {

        'Shotgun':  { name: 'Pump Shotgun',   damage: 10, fireRate: 800, speed: 850, count: 5, color: 0xffaa00, lifespan: 450 }, 
        'Rifle':    { name: 'Assault Rifle',  damage: 8,  fireRate: 100, speed: 1200,count: 1, color: 0x00ff00, lifespan: 800 },
        'Sniper':   { name: 'Heavy Sniper',   damage: 60, fireRate: 1200,speed: 2000,count: 1, color: 0xff00ff, lifespan: 1500 },
        'GrenadeL': { name: 'Grenade Tube',   damage: 45, fireRate: 800, speed: 500, count: 1, color: 0xff5500, lifespan: 1200 },

    const ordnanceArmory = { 
        'Frag': { name: 'Frag Grenade', damage: 55, radius: 120, fuse: 750, maxAmmo: 3, cooldown: 800, color: 0x00ff00 }

        { name: "Recon",    spriteKey: 'recon',    color: 0xaaaa00, melee: 'Knife', gun1: 'Rifle', gun2: 'Sniper' },
        { name: "Heavy",    spriteKey: 'heavy',    color: 0xaa00ff, melee: 'Sword', gun1: 'Rifle', gun2: 'Rocket' }
    ];
    
    let currentRosterIndex = 0, activeCharDef = playerRoster[currentRosterIndex];
    let playerHealth = 100, jumps = 0, playerHealthBar; 
    let currentWeaponIndex = 0, activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife'];
    
    let activeGun = gunArmory[activeCharDef.gun1] || gunArmory['Rifle'];
    let usingPrimaryGun = true; 
    
    let lastFiredTime = 0;
    let currentOrdnanceAmmo = 3, lastTossedTime = 0;
    
    let specialCharge = 0, specialReady = false, meleeHitbox;
    const specialMax = 100;
    let specialButton, specialGraphics;
    let droneActive = false, drone, lastDroneFire = 0;
    
    let comboStep = 0, isAttacking = false, inputBuffered = false, canCancel = false;
    let attackActiveTimer, attackRecoveryTimer;
    let isBlocking = false, isDashing = false, canDash = true, isInvincible = false, isSpawning = false;
    let isFiring = false; 
    
    let enemiesGroup, enemyProjectiles;
    const WORLD_WIDTH = 4800;

    function preload() {
        this.load.plugin('rexvirtualjoystickplugin', 'https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js', true);
        
        this.load.image('bg1', 'assets/bg1_lvl3.png');
        this.load.image('bg2', 'assets/bg2_lvl3.png');
        this.load.image('bg3', 'assets/bg3_lvl3.png');
        this.load.image('floorTile', 'assets/floor_lvl3.png');

        this.load.spritesheet('vanguard', 'assets/vanguard.png', { frameWidth: 56, frameHeight: 37 });
        this.load.spritesheet('recon', 'assets/recon.png', { frameWidth: 56, frameHeight: 37 });
        this.load.spritesheet('heavy', 'assets/heavy.png', { frameWidth: 56, frameHeight: 37 });
        this.load.spritesheet('grunt', 'assets/enemy.grunt.png', { frameWidth: 56, frameHeight: 37 });
    }

    function create() {
        currentScene = this; 
        this.input.addPointer(2);
        
        let dGraphics = this.make.graphics({x: 0, y: 0, add: false});
        dGraphics.fillStyle(0x222222, 1); dGraphics.fillRoundedRect(0, 6, 20, 12, 4); 
        dGraphics.fillStyle(0x777777, 1); dGraphics.fillRect(6, 2, 8, 20); 
        dGraphics.fillStyle(0x00ffff, 1); dGraphics.fillCircle(16, 12, 5); 
        dGraphics.fillStyle(0xffffff, 1); dGraphics.fillCircle(17, 11, 2); 
        dGraphics.generateTexture('drone_tex', 24, 24); 

        this.physics.world.setBounds(0, 0, WORLD_WIDTH, 400);
        this.physics.world.setBoundsCollision(true, true, true, false); 
        this.cameras.main.setBounds(0, 0, WORLD_WIDTH, 400);

        arenaBg = this.add.rectangle(4000, 0, 800, 400, 0x000000).setOrigin(0,0).setDepth(-10);

        let bg1Img = this.textures.exists('bg1') ? 'bg1' : null;
        let bg2Img = this.textures.exists('bg2') ? 'bg2' : null;
        let bg3Img = this.textures.exists('bg3') ? 'bg3' : null;

        if (bg1Img) { let scale1 = 400 / this.textures.get('bg1').getSourceImage().height; bg1Tile = this.add.tileSprite(0, 0, WORLD_WIDTH / scale1, 400/scale1, 'bg1').setOrigin(0, 0).setScale(scale1).setScrollFactor(0.1).setDepth(-5); }
        if (bg2Img) { let scale2 = 400 / this.textures.get('bg2').getSourceImage().height; bg2Tile = this.add.tileSprite(0, 400, WORLD_WIDTH / scale2, 400/scale2, 'bg2').setOrigin(0, 1).setScale(scale2).setScrollFactor(0.4).setDepth(-4); }
        if (bg3Img) { let scale3 = 400 / this.textures.get('bg3').getSourceImage().height; bg3Tile = this.add.tileSprite(0, 400, WORLD_WIDTH / scale3, 400/scale3, 'bg3').setOrigin(0, 1).setScale(scale3).setScrollFactor(0.7).setDepth(-3); }

        grenadesGroup = this.physics.add.group(); enemiesGroup = this.physics.add.group(); enemyProjectiles = this.physics.add.group();
        platforms = this.physics.add.staticGroup(); conveyorGroup = this.physics.add.staticGroup(); lavaGroup = this.physics.add.staticGroup();

        platforms.add(this.add.tileSprite(150, 390, 300, 32, 'floorTile')); platforms.add(this.add.tileSprite(800, 270, 150, 32, 'floorTile')); platforms.add(this.add.tileSprite(2000, 260, 160, 32, 'floorTile')); platforms.add(this.add.tileSprite(2400, 390, 400, 32, 'floorTile')); platforms.add(this.add.tileSprite(4200, 390, 1200, 32, 'floorTile')); 

        createConveyor(600, 390, 400, 1.5); createConveyor(1300, 390, 600, -2.0); createConveyor(1500, 250, 200, 1.5); createConveyor(3000, 390, 600, 2.5); createConveyor(3500, 200, 150, -1.0); 

        createLavaPool(300, 400); createLavaPool(1000, 1000); createLavaPool(1600, 2200); createLavaPool(2600, 2700); createLavaPool(3300, 3600); 

        bossWall = this.add.rectangle(4000, -400, 40, 400, 0x444444).setOrigin(0,0); this.physics.add.existing(bossWall, false); bossWall.body.setImmovable(true); bossWall.body.setAllowGravity(false); bossWall.body.checkCollision.none = true; 

        spawnEnemyAt(600, 300); spawnEnemyAt(1300, 300); spawnEnemyAt(1500, 150); spawnEnemyAt(2400, 300); spawnEnemyAt(3000, 300); spawnEnemyAt(3500, 100);

        // ==========================================
        // PERFECT 250x250 HITBOX SHIFTED UP
        // Stacked directly on top of the old position!
        // X = 4400 (center of room)
        // Y = 75 (Top half of the screen)
        // Width = 250, Height = 250
        // ==========================================
        boss = this.add.rectangle(4400, 75, 250, 250, 0xff0000, 0.3); 
        this.physics.add.existing(boss);
        boss.body.setAllowGravity(false); 
        boss.body.setImmovable(true);
        boss.enemyData = { isBoss: true, hp: 500, maxHp: 500, armor: 200, maxArmor: 200, state: 'sleep', isStunned: false };
        enemiesGroup.add(boss);
        // ==========================================

        const charKeys = ['vanguard', 'recon', 'heavy', 'grunt'];
        charKeys.forEach(char => {
            this.anims.create({ key: `${char}_unarmed_idle`, frames: this.anims.generateFrameNumbers(char, { start: 50, end: 50 }), frameRate: 4, repeat: -1 });
            this.anims.create({ key: `${char}_run_normal`, frames: this.anims.generateFrameNumbers(char, { start: 62, end: 67 }), frameRate: 12, repeat: -1 });
            this.anims.create({ key: `${char}_punch_right`, frames: this.anims.generateFrameNumbers(char, { start: 91, end: 95 }), frameRate: 15 });
            this.anims.create({ key: `${char}_punch_left`, frames: this.anims.generateFrameNumbers(char, { start: 96, end: 100 }), frameRate: 15 });
            this.anims.create({ key: `${char}_whip_stand`, frames: this.anims.generateFrameNumbers(char, { start: 117, end: 124 }), frameRate: 15 });
            this.anims.create({ key: `${char}_die`, frames: this.anims.generateFrameNumbers(char, { start: 125, end: 129 }), frameRate: 8, repeat: 0 });
        });

        player = this.physics.add.sprite(100, 200, activeCharDef.spriteKey); player.setScale(2); player.setCollideWorldBounds(true); player.body.setSize(18, 37); player.body.setOffset(19, 0); 
        
        this.cameras.main.startFollow(player, true, 0.1, 0.1);

        meleeHitbox = this.add.rectangle(-100, -100, 40, 20, 0xffffff).setAlpha(0); this.physics.add.existing(meleeHitbox); meleeHitbox.body.setAllowGravity(false);
        playerHealthBar = this.add.graphics().setDepth(10); bossHpBar = this.add.graphics().setScrollFactor(0).setDepth(20);

        this.physics.add.collider(player, platforms); this.physics.add.collider(player, bossWall); this.physics.add.collider(enemiesGroup, platforms); this.physics.add.collider(grenadesGroup, platforms);
        this.physics.add.collider([player, enemiesGroup, grenadesGroup], conveyorGroup, (entity, conveyor) => { if (entity.body.touching.down && conveyor.body.touching.up) { entity.x += conveyor.beltSpeed; } });
        
        this.physics.add.overlap(grenadesGroup, enemiesGroup, (nade, enemy) => { 
            if (nade.active && enemy.active && enemy.enemyData.state !== 'dead') { explodeGrenade(nade); } 
        });
        
        this.physics.add.collider(enemyProjectiles, platforms, (proj) => { if (proj.isMortar) { let puddle = currentScene.add.circle(proj.x, proj.y, 25, 0xff5500, 0.7); currentScene.tweens.add({ targets: puddle, scale: 1.5, alpha: 0, duration: 400, onComplete: () => puddle.destroy() }); proj.destroy(); } });
        
        this.physics.add.overlap(player, enemyProjectiles, (p, proj) => { proj.destroy(); playerTakeDamage(proj.dmg, proj.x); });
        
        this.physics.add.overlap(player, lavaGroup, () => { if (playerHealth > 0 && !isInvincible) { spawnDamageText(player.x, player.y - 20, 999, true, true); playerTakeDamage(1000, player.x); } });

        uiElements.push(this.add.text(10, 10, 'Melee: ', { fontSize: '12px', fill: '#ffffff', backgroundColor: '#000000' })); meleeText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(10, 25, 'Gun: ', { fontSize: '12px', fill: '#ffff00', backgroundColor: '#000000' })); gunText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(10, 40, `Ammo: ∞`, { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold', backgroundColor: '#000000' })); ammoText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(10, 60, `Nades: `, { fontSize: '14px', fill: '#00ff00', fontStyle: 'bold', backgroundColor: '#000000' })); grenadeText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(400, 20, 'Ready', { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5)); actionText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(400, 40, 'TEAM: 3 LIVES', { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5)); rosterText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(400, 65, 'SCORE: 0', { fontSize: '22px', fill: '#ffaa00', fontStyle: 'bold', backgroundColor: '#000000' }).setOrigin(0.5)); scoreText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(400, 150, '', { fontSize: '32px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setAlpha(0)); centerMsgText = uiElements[uiElements.length-1];

        joyStickLeft = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 120, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xcccccc).setAlpha(0.5), dir: '8dir', forceMin: 16 });

        const btnFire = this.add.circle(670, 300, 45, 0xff0000).setAlpha(0.6).setInteractive(); uiElements.push(btnFire); uiElements.push(this.add.text(670, 300, 'FIRE', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); btnFire.on('pointerdown', () => { isFiring = true; }); btnFire.on('pointerup', () => { isFiring = false; }); btnFire.on('pointerout', () => { isFiring = false; });
        const btnJump = this.add.circle(710, 360, 45, 0x00ffff).setAlpha(0.6).setInteractive(); uiElements.push(btnJump); uiElements.push(this.add.text(710, 360, 'JUMP', { fontSize: '16px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5)); btnJump.on('pointerdown', () => { if (!isAttacking && !isBlocking && !isDashing && jumps < 3 && !isSpawning) { player.body.setVelocityY(-450); jumps++; actionText.setText('Jump: ' + jumps + '/3'); } });
        const btnSwap = this.add.circle(550, 250, 25, 0x8800ff).setAlpha(0.7).setInteractive(); uiElements.push(btnSwap); uiElements.push(this.add.text(550, 250, 'SWAP', { fontSize: '12px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); btnSwap.on('pointerdown', () => { if (isSpawning || playerHealth <= 0) return; usingPrimaryGun = !usingPrimaryGun; activeGun = usingPrimaryGun ? (gunArmory[activeCharDef.gun1] || gunArmory['Rifle']) : (gunArmory[activeCharDef.gun2] || gunArmory['Shotgun']); gunText.setText('Gun: ' + activeGun.name); actionText.setText(`EQUIPPED: ${activeGun.name.toUpperCase()}`); });
        const btnDefend = this.add.circle(580, 300, 25, 0x888888).setAlpha(0.8).setInteractive(); uiElements.push(btnDefend); uiElements.push(this.add.text(580, 300, 'DEF', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); btnDefend.on('pointerdown', () => { if (isAttacking || isDashing || isSpawning) return; if (joyStickLeft.left || joyStickLeft.right) { if (canDash) executeDash(); } else { isBlocking = true; player.setTint(0x888888); actionText.setText('BLOCKING'); } }); btnDefend.on('pointerup', releaseBlock); btnDefend.on('pointerout', releaseBlock); function releaseBlock() { if (isBlocking) { isBlocking = false; player.clearTint(); actionText.setText('Ready'); } }
        const btnMelee = this.add.circle(610, 230, 25, 0xffaa00).setAlpha(0.6).setInteractive(); uiElements.push(btnMelee); uiElements.push(this.add.text(610, 230, 'HIT', { fontSize: '14px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5)); btnMelee.on('pointerdown', () => { if (isBlocking || isDashing || isSpawning) return; if (!isAttacking) executeAttack(1); else { inputBuffered = true; if (canCancel && comboStep < 3) triggerNextHit(); } });
        const btnToss = this.add.circle(680, 210, 25, 0x00cc00).setAlpha(0.6).setInteractive(); uiElements.push(btnToss); uiElements.push(this.add.text(680, 210, 'TOSS', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); btnToss.on('pointerdown', tossGrenade);
        const btnHeavy = this.add.circle(630, 170, 25, 0xff3300).setAlpha(0.7).setInteractive(); uiElements.push(btnHeavy); uiElements.push(this.add.text(630, 170, 'HVY', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); btnHeavy.on('pointerdown', () => { if (!isBlocking && !isDashing && !isAttacking && !isSpawning) executeHeavyAttack(); });

        specialButton = this.add.circle(750, 210, 30, 0x555555).setAlpha(0.7).setInteractive(); uiElements.push(specialButton); uiElements.push(this.add.text(750, 210, 'ULT', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5)); specialGraphics = this.add.graphics(); uiElements.push(specialGraphics);
        specialButton.on('pointerdown', () => { if (specialReady && !isAttacking && !isBlocking && !isSpawning) { droneActive = true; actionText.setText('DRONE DEPLOYED!'); drone = currentScene.physics.add.sprite(player.x, player.y - 40, 'drone_tex'); drone.body.setAllowGravity(false); currentScene.time.delayedCall(10000, () => { droneActive = false; if(drone) drone.destroy(); actionText.setText('DRONE OFFLINE'); currentScene.time.delayedCall(1000, () => actionText.setText('Ready')); }); specialCharge = 0; specialReady = false; specialButton.setFillStyle(0x555555); specialGraphics.clear(); } });

        uiElements.forEach(el => { if (el.setScrollFactor) el.setScrollFactor(0); }); joyStickLeft.base.setScrollFactor(0); joyStickLeft.thumb.setScrollFactor(0);
        
        applyCharacterLoadout();
    }

    function createConveyor(centerX, y, width, speed) { let conveyor = currentScene.add.tileSprite(centerX, y, width, 32, 'floorTile'); currentScene.physics.add.existing(conveyor, true); conveyor.beltSpeed = speed; conveyorGroup.add(conveyor); conveyorBelts.push(conveyor); }

    function createLavaPool(startX, endX) {
        let width = endX - startX; let centerX = startX + (width / 2); let pool = currentScene.add.rectangle(centerX, 388, width, 24, 0x000000, 0); lavaGroup.add(pool); let g = currentScene.add.graphics().setDepth(5); lavaGraphicLayers.push({ graphics: g, startX: startX, width: width });
        let sparkCount = Math.max(3, Math.floor(width / 50));
        for (let i = 0; i < sparkCount; i++) {
            let ventX = startX + 25 + (i * ((width - 50) / (sparkCount - 1))); currentScene.time.addEvent({ delay: Phaser.Math.Between(150, 400), loop: true, callback: () => {
                let sx = ventX + Phaser.Math.Between(-20, 20); let spark = currentScene.add.circle(sx, 395, Phaser.Math.Between(1, 3), 0xffdd00, 1).setDepth(6);
                currentScene.tweens.add({ targets: spark, y: 350 + Phaser.Math.Between(-30, 10), x: sx + Phaser.Math.Between(-15, 15), alpha: 0, duration: Phaser.Math.Between(400, 700), onComplete: () => spark.destroy() });
            }});
        }
    }

    function playAnim(animSuffix) { player.anims.play(`${activeCharDef.spriteKey}_${animSuffix}`, true); }
    function showCenterMessage(text, color) { centerMsgText.setText(text); centerMsgText.setFill(color); centerMsgText.setAlpha(1); currentScene.tweens.add({ targets: centerMsgText, alpha: 0, delay: 2000, duration: 1000 }); }

    function spawnEnemyAt(x, y) {
        let enemy = currentScene.physics.add.sprite(x, y, 'grunt'); enemy.setScale(2); enemy.body.setCollideWorldBounds(true);
        let hitbox = currentScene.add.rectangle(-100, -100, 30, 30, 0xffffff).setAlpha(0); currentScene.physics.add.existing(hitbox); hitbox.body.setAllowGravity(false);
        let barGraphics = currentScene.add.graphics().setDepth(10);
        enemy.enemyData = { isBoss: false, hp: 60, maxHp: 60, armor: 20, maxArmor: 20, state: 'idle', canAttack: true, isStunned: false, hitbox: hitbox, bars: barGraphics }; enemiesGroup.add(enemy);
    }

    function applyCharacterLoadout() {
        activeCharDef = playerRoster[currentRosterIndex]; player.clearTint(); player.setTexture(activeCharDef.spriteKey); currentWeaponIndex = weaponKeys.indexOf(activeCharDef.melee); activeWeapon = weaponArmory[activeCharDef.melee] || weaponArmory['Knife']; usingPrimaryGun = true; activeGun = gunArmory[activeCharDef.gun1] || gunArmory['Rifle']; playerHealth = 100; currentOrdnanceAmmo = activeOrdnance.maxAmmo; isSpawning = false;
        meleeText.setText('Melee: ' + activeWeapon.name); gunText.setText('Gun: ' + activeGun.name); rosterText.setText(`TEAM: ${3 - currentRosterIndex} LIVES`); actionText.setText(`${activeCharDef.name} DROPS IN!`); updateUI();
    }

    function spawnNextCharacter() { if (currentRosterIndex >= 3) return; isSpawning = true; isInvincible = true; player.x = currentScene.cameras.main.scrollX + 100; player.y = -50; player.body.setVelocityY(800); applyCharacterLoadout(); player.setAlpha(0.5); currentScene.time.delayedCall(1500, () => { isInvincible = false; player.setAlpha(1); actionText.setText('Ready'); }); }

    function spawnDamageText(x, y, amount, isCritical = false, isPlayerHit = false) {
        let textContent = amount >= 900 ? "LAVA BURN!" : Math.round(amount).toString(); let floatText = currentScene.add.text(x, y, textContent, { fontSize: isCritical ? '36px' : '22px', fill: isPlayerHit ? '#ff3300' : '#ffdd00', fontStyle: 'bold', stroke: '#000000', strokeThickness: 5 }).setOrigin(0.5).setDepth(25);
        currentScene.tweens.add({ targets: floatText, x: floatText.x + Phaser.Math.Between(-25, 25), y: floatText.y - 60, alpha: 0, duration: 900, ease: 'Cubic.easeOut', onComplete: () => floatText.destroy() });
    }

    function drawWhipFX(isHeavy) {
        let slashGraphic = currentScene.add.graphics(); slashGraphic.lineStyle(isHeavy ? 10 : 4, activeWeapon.color, 1); slashGraphic.beginPath(); let whipLength = (facingDirection === 0) ? activeWeapon.reach : -activeWeapon.reach; let startY = player.y - 5;
        slashGraphic.moveTo(player.x, startY); slashGraphic.lineTo(player.x + whipLength * 0.4, startY - 15); slashGraphic.lineTo(player.x + whipLength * 0.8, startY + 10); slashGraphic.lineTo(player.x + whipLength, startY); slashGraphic.strokePath();
        let crack = currentScene.add.circle(player.x + whipLength, startY, isHeavy ? 25 : 12, 0xffffff, 0.9); currentScene.tweens.add({ targets: crack, scale: 1.5, alpha: 0, duration: 150, onComplete: () => crack.destroy() }); currentScene.tweens.add({ targets: slashGraphic, alpha: 0, duration: 150, onComplete: () => slashGraphic.destroy() });

                        currentScene.time.delayedCall(1500, () => { if(enemyBullet.active) enemyBullet.destroy(); }); if (data.state !== 'dead') data.state = 'idle';
                    });
                    currentScene.time.delayedCall(2500, () => { data.canAttack = true; });
                } else if (distToPlayer > 75 && data.state !== 'attack' && data.state !== 'shoot') {
                    data.state = 'chase'; let dir = (player.x > enemy.x) ? 1 : -1; enemy.body.setVelocityX(100 * dir); enemy.setFlipX(dir === -1); enemy.anims.play('grunt_run_normal', true);
                    if (enemy.body.blocked.left || enemy.body.blocked.right) { if(enemy.body.touching.down) enemy.body.setVelocityY(-400); }
                } else if (data.state !== 'attack' && data.state !== 'shoot') { data.state = 'idle'; enemy.body.setVelocityX(0); enemy.anims.play('grunt_unarmed_idle', true); }
            } else { if (data.state !== 'attack' && data.state !== 'shoot') { enemy.body.setVelocityX(0); if(enemy.active && data.state !== 'dead') enemy.anims.play('grunt_unarmed_idle', true); } }
        });

        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(750, 210, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false); specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }
</script>
