        this.anims.create({ key: 'boss_anim_shoot', frames: this.anims.generateFrameNumbers('boss_shoot', { start: 0, end: 2 }), frameRate: 10, repeat: -1 });
        this.anims.create({ key: 'boss_anim_duck', frames: this.anims.generateFrameNumbers('boss_duck', { start: 0, end: 0 }), frameRate: 1 });
        this.anims.create({ key: 'boss_anim_cling', frames: this.anims.generateFrameNumbers('boss_cling', { start: 0, end: 0 }), frameRate: 1 });
        this.anims.create({ key: 'boss_anim_shoot_up', frames: this.anims.generateFrameNumbers('boss_shoot_up', { start: 0, end: 0 }), frameRate: 1 });

        const charKeys = ['vanguard', 'recon', 'heavy', 'grunt'];
        charKeys.forEach(char => {

        player = this.physics.add.sprite(100, 200, activeCharDef.spriteKey); player.setScale(2); player.setCollideWorldBounds(true); player.body.setSize(18, 37); player.body.setOffset(19, 0);

        playerHealthBar = this.add.graphics().setDepth(10); bossHpBar = this.add.graphics().setScrollFactor(0).setDepth(20);

        this.physics.add.collider(player, platforms); 
        this.physics.add.collider(player, bossWall); 
        this.physics.add.collider(player, arenaRightWall); 
        this.physics.add.collider(enemiesGroup, bossWall); 
        this.physics.add.collider(enemiesGroup, arenaRightWall); 
        
        this.physics.add.collider(enemiesGroup, platforms); 
        this.physics.add.collider(grenadesGroup, platforms);
        this.physics.add.collider([player, enemiesGroup, grenadesGroup], conveyorGroup, (entity, conveyor) => { if (entity.body.touching.down && conveyor.body.touching.up) { entity.x += conveyor.beltSpeed; } });
        
        this.physics.add.overlap(grenadesGroup, enemiesGroup, (nade, enemy) => { if (nade.active && enemy.active && enemy.enemyData.state !== 'dead') { explodeGrenade(nade); } });

        this.physics.add.overlap(enemiesGroup, bioGroup, (enemy, bioVat) => { if (enemy.active && enemy.enemyData && !enemy.enemyData.isBoss && enemy.enemyData.state !== 'dead') { spawnDamageText(enemy.x, enemy.y - 20, 999, true, false); dealDamageToEnemy(enemy, 9999, 1.0, 0); } });

        uiElements.push(this.add.text(10, 10, 'Melee: ', { fontSize: '12px', fill: '#ffffff', backgroundColor: '#000000' }).setDepth(110)); meleeText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(10, 25, 'Gun: ', { fontSize: '12px', fill: '#ffff00', backgroundColor: '#000000' }).setDepth(110)); gunText = uiElements[uiElements.length-1];
        uiElements.push(this.add.text(10, 40, `Ammo: ∞`, { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold', backgroundColor: '#000000' }).setDepth(110)); ammoText = uiElements[uiElements.length-1];

        joyStickLeft = this.plugins.get('rexvirtualjoystickplugin').add(this, { x: 120, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3).setDepth(110), thumb: this.add.circle(0, 0, 30, 0xcccccc).setAlpha(0.5).setDepth(111), dir: '8dir', forceMin: 16 });

        const btnFire = this.add.circle(650, 340, 40, 0xff0000).setAlpha(0.6).setInteractive().setDepth(110); uiElements.push(btnFire); uiElements.push(this.add.text(650, 340, 'FIRE', { fontSize: '18px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5).setDepth(111)); btnFire.on('pointerdown', () => { if(!isPaused) isFiring = true; }); btnFire.on('pointerup', () => { isFiring = false; }); btnFire.on('pointerout', () => { isFiring = false; });

    function playerTakeDamage(incomingDmg, attackXLocation) {

        if (isBlocking) { 
            let playerFacingRight = (facingDirection === 0), attackFromRight = (attackXLocation > player.x); 
            if ((playerFacingRight && attackFromRight) || (!playerFacingRight && !attackFromRight)) finalDmg *= 0.2; 
        } 
        player.setTint(0xff0000); 
        currentScene.time.delayedCall(150, () => { if (!isBlocking && !isAttacking && !isDashing) player.clearTint(); }); 
        playerHealth -= finalDmg; 
        spawnDamageText(player.x, player.y - 30, finalDmg, finalDmg >= 30, true);

            playerHealth = 0; 
            currentRosterIndex++; 
            if (currentRosterIndex < playerRoster.length) {
                spawnNextCharacter(); 
            } else { 
                player.setAlpha(0); 
                actionText.setText('TEAM WIPED! Redirecting...'); 
                rosterText.setText('TEAM: 0 LIVES');

    }

    function update() {

        bioGraphicLayers.forEach(layer => {
            let g = layer.graphics; g.clear(); 
            g.fillStyle(0x001122, 0.95); g.fillRect(layer.startX, 360, layer.width, 40); 
            g.fillStyle(0x004433, 0.85); g.beginPath(); g.moveTo(layer.startX, 400);
            for (let x = layer.startX; x <= layer.startX + layer.width; x += 8) { let waveY = 362 + Math.sin((x * 0.05) + (currentTime * 0.002)) * 4 + Math.cos((x * 0.03) - (currentTime * 0.001)) * 2; g.lineTo(x, waveY); }
            g.lineTo(layer.startX + layer.width, 400); g.closePath(); g.fillPath(); 
            g.fillStyle(0x00ffcc, 0.9); g.beginPath(); g.moveTo(layer.startX, 400);
            for (let x = layer.startX; x <= layer.startX + layer.width; x += 6) { let waveY = 365 + Math.sin((x * 0.07) - (currentTime * 0.003)) * 3 + Math.sin((x * 0.04) + (currentTime * 0.002)) * 3; g.lineTo(x, waveY); }
            g.lineTo(layer.startX + layer.width, 400); g.closePath(); g.fillPath(); 
            g.lineStyle(2, 0xffffff, 0.9); g.beginPath();
            for (let x = layer.startX; x <= layer.startX + layer.width; x += 6) { let waveY = 365 + Math.sin((x * 0.07) - (currentTime * 0.003)) * 3 + Math.sin((x * 0.04) + (currentTime * 0.002)) * 3; if (x === layer.startX) g.moveTo(x, waveY); else g.lineTo(x, waveY); } g.strokePath();
        });

        if (!bossActive && player.x > 5700) triggerBoss();
        if (player.y > 420 && playerHealth > 0 && !isSpawning) playerTakeDamage(1000, player.x); 

        if (!isDashing && !isAttacking && !isBlocking && !isSpawning && playerHealth > 0) {
            player.rotation = 0; 
            if (joyStickLeft.left) { player.body.setVelocityX(-250); playAnim('run_normal'); } else if (joyStickLeft.right) { player.body.setVelocityX(250); playAnim('run_normal'); } else { player.body.setVelocityX(0); playAnim('unarmed_idle'); }
            
            if (player.body.touching.down || player.body.blocked.down) jumps = 0;
            
            let shootAngle = facingDirection; let nearestEnemy = null; let minDist = 600;
            if (isFiring) {
                enemiesGroup.getChildren().forEach(enemy => { if (enemy.active && enemy.enemyData.state !== 'dead' && enemy.y <= 420) { let dist = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y); if (dist < minDist) { minDist = dist; nearestEnemy = enemy; } } });
                if (nearestEnemy) { shootAngle = Phaser.Math.Angle.Between(player.x, player.y, nearestEnemy.x, nearestEnemy.y); facingDirection = (nearestEnemy.x < player.x) ? Math.PI : 0; } 
                else { if (joyStickLeft.force > 0) { shootAngle = joyStickLeft.rotation; facingDirection = Math.abs(shootAngle) > Math.PI/2 ? Math.PI : 0; } }
                if (currentTime > lastFiredTime + activeGun.fireRate) { shootGun(shootAngle); lastFiredTime = currentTime; }
            } else { if (joyStickLeft.left) facingDirection = Math.PI; else if (joyStickLeft.right) facingDirection = 0; }
            player.setFlipX(facingDirection === Math.PI);
        } else if (isAttacking || isBlocking) { player.body.setVelocityX(0); player.rotation = 0; }
        
        if (droneActive && drone && playerHealth > 0) {
            let targetX = player.x + (facingDirection === 0 ? -30 : 30); let targetY = player.y - 40 + (Math.sin(currentTime / 200) * 8); 
            drone.x = Phaser.Math.Linear(drone.x, targetX, 0.1); drone.y = Phaser.Math.Linear(drone.y, targetY, 0.1);
            if (currentTime > lastDroneFire + 300) {
                let nearestEnemy = null; let minDist = 500;
                enemiesGroup.getChildren().forEach(enemy => { if (enemy.active && enemy.enemyData.state !== 'dead' && enemy.y <= 420) { let dist = Phaser.Math.Distance.Between(drone.x, drone.y, enemy.x, enemy.y); if (dist < minDist) { minDist = dist; nearestEnemy = enemy; } } });
                if (nearestEnemy) {
                    let angle = Phaser.Math.Angle.Between(drone.x, drone.y, nearestEnemy.x, nearestEnemy.y); drone.rotation = angle;
                    let laser = currentScene.add.rectangle(drone.x, drone.y, 10, 3, 0x00ffff); currentScene.physics.add.existing(laser); laser.body.setAllowGravity(false); currentScene.physics.velocityFromRotation(angle, 900, laser.body.velocity); laser.rotation = angle;
                    currentScene.physics.add.overlap(laser, enemiesGroup, (l, enemy) => {
                        if (enemy.enemyData.state !== 'dead') { l.destroy(); dealDamageToEnemy(enemy, 15, 0.8, 0); if(!enemy.enemyData.isBoss) { enemy.setTint(0x00ffff); currentScene.time.delayedCall(50, () => { if(enemy.active && !enemy.enemyData.isStunned) enemy.clearTint(); }); } }
                    });
                    currentScene.time.delayedCall(1000, () => { if(laser.active) laser.destroy(); }); lastDroneFire = currentTime;
                } else { drone.rotation = facingDirection; }
            }
        } else if (droneActive && playerHealth <= 0) { droneActive = false; if(drone) drone.destroy(); }
        
        // --- PROTOTYPE ANDROID BOSS AI LOOP ---
        if (bossActive && !bossDefeated && boss.active && boss.enemyData.state !== 'sleep' && boss.enemyData.state !== 'dead') {
            let distToPlayer = Math.abs(boss.x - player.x); 
            let bossDir = (player.x > boss.x) ? 1 : -1;
            
            if (boss.enemyData.state !== 'jump') boss.setFlipX(bossDir === -1); 
            
            if (boss.enemyData.state === 'jump') {
                if (boss.body.blocked.down && boss.body.velocity.y >= 0) {
                    boss.enemyData.state = 'chase';
                    boss.body.setVelocityX(0);
                    boss.enemyData.actionTimer = currentTime + 200; 
                }
            }

            if (currentTime > boss.enemyData.actionTimer && boss.enemyData.state !== 'jump' && boss.body.blocked.down) {
                let randMove = Math.random();
                
                if (distToPlayer < 200 && randMove < 0.6) {
                    boss.enemyData.state = 'jump';
                    boss.body.setVelocityY(-550);
                    boss.body.setVelocityX(bossDir * -400); 
                    boss.anims.play('boss_anim_jump', true);
                    boss.enemyData.actionTimer = currentTime + 3000; 
                } 
                else if (distToPlayer > 300 || randMove < 0.4) {
                    boss.enemyData.state = 'run_gun';
                    boss.anims.play('boss_anim_run_shot', true);
                    boss.enemyData.actionTimer = currentTime + 2000;
                } 
                else {
                    boss.enemyData.state = 'chase';
                    boss.anims.play('boss_anim_run', true);
                    boss.enemyData.actionTimer = currentTime + 1500;
                }
            }

            if (boss.enemyData.state === 'chase') {
                boss.body.setVelocityX(bossDir * 280); 
            } 
            else if (boss.enemyData.state === 'run_gun') {
                boss.body.setVelocityX(bossDir * 180);
                
                boss.enemyData.lastShot = boss.enemyData.lastShot || 0;
                if (currentTime > boss.enemyData.lastShot + 300) { 
                    let plasma = currentScene.add.rectangle(boss.x + (bossDir * 40), boss.y - 15, 20, 6, 0xff00ff);
                    currentScene.physics.add.existing(plasma);
                    enemyProjectiles.add(plasma); // ADDED TO GROUP FIRST
                    plasma.body.setAllowGravity(false); // GRAVITY STRIPPED SECOND
                    plasma.body.setVelocityX(bossDir * 800);
                    plasma.dmg = 20; 
                    currentScene.time.delayedCall(2000, () => { if(plasma.active) plasma.destroy(); });
                    
                    boss.enemyData.lastShot = currentTime;
                }
            }
            
            if (Phaser.Geom.Intersects.RectangleToRectangle(boss.getBounds(), player.getBounds()) && playerHealth > 0) {
                boss.enemyData.lastMelee = boss.enemyData.lastMelee || 0;
                if (currentTime > boss.enemyData.lastMelee + 1000) {
                    playerTakeDamage(30, boss.x);
                    boss.enemyData.lastMelee = currentTime;
                }
            }
        }

        // --- GRUNT AI ---
        enemiesGroup.getChildren().forEach(enemy => {
            let data = enemy.enemyData; if (data.isBoss) return; if (enemy.y > 420) { if (enemy.active) enemy.destroy(); return; } if (data.state === 'dead') return; 
            
            let distToPlayer = Phaser.Math.Distance.Between(enemy.x, enemy.y, player.x, player.y); 
            
            if (distToPlayer > 400) {
                if (data.state !== 'dead') { data.state = 'idle'; enemy.body.setVelocityX(0); enemy.anims.play('grunt_unarmed_idle', true); }
                return;
            }

            if (!data.isStunned && playerHealth > 0 && !isSpawning) {
                if (distToPlayer < 75 && data.canAttack) {
                    data.state = 'attack'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.clearTint(); enemy.anims.play('grunt_punch_right', true);
                    currentScene.time.delayedCall(400, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0 || data.state === 'dead') return; 
                        data.hitbox.setPosition(enemy.x + (enemy.x < player.x ? 25 : -25), enemy.y); data.hitbox.setAlpha(1);
                        if (Phaser.Geom.Intersects.RectangleToRectangle(data.hitbox.getBounds(), player.getBounds())) { playerTakeDamage(25, enemy.x); }
                        currentScene.time.delayedCall(150, () => { data.hitbox.setAlpha(0); data.hitbox.setPosition(-100, -100); if (data.state !== 'dead') data.state = 'idle'; });
                    });
                    currentScene.time.delayedCall(2000, () => { data.canAttack = true; });
                } else if (distToPlayer >= 100 && distToPlayer <= 350 && data.canAttack && data.state !== 'attack') {
                    data.state = 'shoot'; data.canAttack = false; enemy.body.setVelocityX(0); enemy.clearTint(); let dir = (player.x > enemy.x) ? 1 : -1; enemy.setFlipX(dir === -1); enemy.anims.play('grunt_punch_left', true);
                    currentScene.time.delayedCall(300, () => {
                        if (data.isStunned || !enemy.active || playerHealth <= 0 || data.state === 'dead') return; 
                        let enemyBullet = currentScene.add.rectangle(enemy.x + (dir * 25), enemy.y, 10, 4, 0x00ffff); 
                        currentScene.physics.add.existing(enemyBullet); 
                        enemyProjectiles.add(enemyBullet); // ADDED TO GROUP FIRST
                        enemyBullet.body.setAllowGravity(false); // GRAVITY STRIPPED SECOND
                        enemyBullet.body.setVelocityX(dir * 500); 
                        enemyBullet.dmg = 10; 
                        currentScene.time.delayedCall(1500, () => { if(enemyBullet.active) enemyBullet.destroy(); }); if (data.state !== 'dead') data.state = 'idle';
                    });
                    currentScene.time.delayedCall(1500, () => { data.canAttack = true; });
                } else if (distToPlayer > 75 && data.state !== 'attack' && data.state !== 'shoot') {
                    if (Math.abs(player.y - enemy.y) < 40) {
                        data.state = 'chase'; let dir = (player.x > enemy.x) ? 1 : -1; enemy.body.setVelocityX(100 * dir); enemy.setFlipX(dir === -1); enemy.anims.play('grunt_run_normal', true);
                        if (enemy.body.blocked.left || enemy.body.blocked.right) { if(enemy.body.touching.down) enemy.body.setVelocityY(-400); }
                    } else {
                        data.state = 'idle'; enemy.body.setVelocityX(0); enemy.anims.play('grunt_unarmed_idle', true);
                    }
                } else if (data.state !== 'attack' && data.state !== 'shoot') { data.state = 'idle'; enemy.body.setVelocityX(0); enemy.anims.play('grunt_unarmed_idle', true); }
            } else { if (data.state !== 'attack' && data.state !== 'shoot') { enemy.body.setVelocityX(0); if(enemy.active && data.state !== 'dead') enemy.anims.play('grunt_unarmed_idle', true); } }
        });

        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(750, 210, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false); specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }
</script>
