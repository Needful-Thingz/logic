<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Needful Thingz - Arena V11 (Heavy Melee Attacks)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            width: 800,
            height: 400
        },
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 800 }, debug: false }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);
    
    // Core Entities
    let player, dummy, joyStickLeft, joyStickRight;
    let meleeText, gunText, ammoText, grenadeText, actionText;
    let facingDirection = 0, currentScene, grenadesGroup; 
    
    // Player Stats
    let playerHealth = 100, jumps = 0, joystickUpReleased = true;
    
    // --- ARMORY DATA ---
    const weaponArmory = {
        'Knife': { name: 'Combat Knife', damage: 28, reach: 40, pierce: 0.15, stun: 0, speed: 80, color: 0xcccccc },
        'Sword': { name: 'Broadsword', damage: 35, reach: 75, pierce: 0.50, stun: 0, speed: 150, color: 0xff3333 },
        'Whip':  { name: 'Energy Whip',  damage: 12, reach: 170, pierce: 0.90, stun: 1.0, speed: 250, color: 0x00ffff }
    };
    let weaponKeys = ['Knife', 'Sword', 'Whip'];
    let currentWeaponIndex = 0, activeWeapon = weaponArmory['Knife'];

    const gunArmory = {
        'Pistol':   { name: 'Service Pistol', damage: 15, fireRate: 300, speed: 900, count: 1, color: 0xcccccc, lifespan: 1000, clipSize: 12, reloadTime: 1000 },
        'Shotgun':  { name: 'Pump Shotgun',   damage: 10, fireRate: 800, speed: 600, count: 5, color: 0xffaa00, lifespan: 300,  clipSize: 6,  reloadTime: 3000 }, 
        'Rifle':    { name: 'Assault Rifle',  damage: 8,  fireRate: 100, speed: 1200,count: 1, color: 0x00ff00, lifespan: 800,  clipSize: 30, reloadTime: 1200 },
        'Sniper':   { name: 'Heavy Sniper',   damage: 60, fireRate: 1200,speed: 2000,count: 1, color: 0xff00ff, lifespan: 1500, clipSize: 5,  reloadTime: 2500 },
        'GrenadeL': { name: 'Grenade Tube',   damage: 45, fireRate: 800, speed: 500, count: 1, color: 0xff5500, lifespan: 1200, clipSize: 4,  reloadTime: 2200 },
        'Rocket':   { name: 'RPG Launcher',   damage: 90, fireRate: 1000,speed: 900, count: 1, color: 0xff0000, lifespan: 2000, clipSize: 1,  reloadTime: 3000 }
    };
    let gunKeys = ['Pistol', 'Shotgun', 'Rifle', 'Sniper', 'GrenadeL', 'Rocket'];
    let currentGunIndex = 1, activeGun = gunArmory['Shotgun'];
    let lastFiredTime = 0, currentAmmo = activeGun.clipSize, isReloading = false, reloadTimer;

    const ordnanceArmory = { 'Frag': { name: 'Frag Grenade', damage: 50, radius: 110, fuse: 1500, maxAmmo: 3, cooldown: 1000, color: 0x00ff00 } };
    let activeOrdnance = ordnanceArmory['Frag'];
    let currentOrdnanceAmmo = activeOrdnance.maxAmmo, lastTossedTime = 0;
    
    // --- COMBAT & DEFENSE FLAGS ---
    let specialCharge = 0, specialReady = false, meleeHitbox, isStunned = false;
    let comboStep = 0, isAttacking = false, inputBuffered = false, canCancel = false;
    let attackActiveTimer, attackRecoveryTimer;
    let isBlocking = false, isDashing = false, canDash = true, isInvincible = false;
    
    let dummyHealth = 100, dummyArmor = 100, dummyHealthBar, dummyArmorBar;
    
    function preload() {
        this.load.plugin('rexvirtualjoystickplugin', 'https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.1.39/dist/rexvirtualjoystickplugin.min.js', true);
    }

    function create() {
        currentScene = this; grenadesGroup = this.physics.add.group(); 

        const floor = this.add.rectangle(400, 380, 800, 40, 0x444444);
        const islandTop = this.add.rectangle(400, 180, 250, 20, 0x666666);
        const islandMid = this.add.rectangle(400, 220, 80, 60, 0x555555);
        const islandBot = this.add.rectangle(400, 260, 250, 20, 0x666666);
        [floor, islandTop, islandMid, islandBot].forEach(obj => this.physics.add.existing(obj, true));

        player = this.add.rectangle(200, 300, 30, 50, 0x00aaff);
        this.physics.add.existing(player); player.body.setCollideWorldBounds(true);
        
        dummy = this.add.rectangle(600, 335, 30, 50, 0xff5555);
        this.physics.add.existing(dummy, true);

        meleeHitbox = this.add.rectangle(-100, -100, 40, 20, activeWeapon.color).setAlpha(0);
        this.physics.add.existing(meleeHitbox); meleeHitbox.body.setAllowGravity(false);
        
        dummyHealthBar = this.add.graphics(); dummyArmorBar = this.add.graphics(); updateDummyBars();

        this.physics.add.collider(player, [floor, islandTop, islandMid, islandBot]);
        this.physics.add.collider(grenadesGroup, [floor, islandTop, islandMid, islandBot]);

        meleeText = this.add.text(10, 10, 'Melee: Combat Knife', { fontSize: '12px', fill: '#ffffff' });
        gunText = this.add.text(10, 25, 'Gun: Pump Shotgun', { fontSize: '12px', fill: '#ffff00' });
        ammoText = this.add.text(10, 40, `Ammo: ${currentAmmo}/${activeGun.clipSize}`, { fontSize: '14px', fill: '#00ffff', fontStyle: 'bold' });
        grenadeText = this.add.text(10, 60, `Nades: ${currentOrdnanceAmmo}/${activeOrdnance.maxAmmo}`, { fontSize: '14px', fill: '#00ff00', fontStyle: 'bold' });
        actionText = this.add.text(400, 20, 'Ready', { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);

        // --- CONTROLS ---
        joyStickLeft = this.plugins.get('rexvirtualjoystickplugin').add(this, {
            x: 120, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xcccccc).setAlpha(0.5), dir: '8dir', forceMin: 16
        });
        const leftTapZone = this.add.circle(120, 300, 25, 0xffffff, 0).setInteractive();
        leftTapZone.on('pointerdown', () => {
            if (isAttacking || isBlocking || isDashing) return; 
            if (jumps < 3) { player.body.setVelocityY(-450); jumps++; actionText.setText('Triple Jump: ' + jumps + '/3'); }
        });

        joyStickRight = this.plugins.get('rexvirtualjoystickplugin').add(this, {
            x: 680, y: 300, radius: 50, base: this.add.circle(0, 0, 60, 0x888888).setAlpha(0.3), thumb: this.add.circle(0, 0, 30, 0xff0000).setAlpha(0.5), dir: '8dir', forceMin: 16
        });

        // --- NEW ACTION GRID LAYOUT ---
        
        // HIT (Light Attack)
        const btnMelee = this.add.circle(570, 310, 25, 0xffaa00).setAlpha(0.6).setInteractive();
        this.add.text(554, 302, 'HIT', { fontSize: '14px', fill: '#000', fontStyle: 'bold' });
        btnMelee.on('pointerdown', () => {
            if (isStunned || isBlocking || isDashing) return;
            if (!isAttacking) executeAttack(1);
            else { inputBuffered = true; if (canCancel && comboStep < 3) triggerNextHit(); }
        });

        // NEW: HEAVY ATTACK BUTTON
        const btnHeavy = this.add.circle(570, 250, 25, 0xff3300).setAlpha(0.7).setInteractive();
        this.add.text(554, 242, 'HVY', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' });
        btnHeavy.on('pointerdown', () => {
            if (isStunned || isBlocking || isDashing || isAttacking) return;
            executeHeavyAttack();
        });

        // TOSS (Grenade)
        const btnToss = this.add.circle(510, 250, 25, 0x00cc00).setAlpha(0.6).setInteractive();
        this.add.text(492, 242, 'TOSS', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' });
        btnToss.on('pointerdown', tossGrenade);

        // DEFEND (Block/Dash)
        const btnDefend = this.add.circle(510, 310, 25, 0x888888).setAlpha(0.8).setInteractive();
        this.add.text(495, 302, 'DEF', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' });
        btnDefend.on('pointerdown', () => {
            if (isAttacking || isDashing || isStunned) return;
            if (joyStickLeft.left || joyStickLeft.right) { if (canDash) executeDash(); } 
            else { isBlocking = true; player.fillColor = 0xcccccc; actionText.setText('BLOCKING'); }
        });
        btnDefend.on('pointerup', releaseBlock);
        btnDefend.on('pointerout', releaseBlock);

        function releaseBlock() {
            if (isBlocking) { isBlocking = false; player.fillColor = 0x00aaff; actionText.setText('Ready'); }
        }

        // RELOAD
        const btnReload = this.add.circle(450, 310, 25, 0x4444ff).setAlpha(0.7).setInteractive();
        this.add.text(435, 302, 'RLD', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' });
        btnReload.on('pointerdown', () => {
            if (!isReloading && !isAttacking && !isBlocking && !isDashing && currentAmmo < activeGun.clipSize) reloadGun();
        });

        // Swaps (Moved left to fit grid)
        const btnMeleeSwap = this.add.circle(450, 180, 20, 0xaaaaaa).setAlpha(0.5).setInteractive();
        this.add.text(432, 172, 'M-GEAR', { fontSize: '10px', fill: '#fff', fontStyle: 'bold' });
        btnMeleeSwap.on('pointerdown', () => {
            if (isAttacking || isBlocking) return; 
            currentWeaponIndex = (currentWeaponIndex + 1) % weaponKeys.length;
            activeWeapon = weaponArmory[weaponKeys[currentWeaponIndex]];
            meleeText.setText('Melee: ' + activeWeapon.name);
        });

        const btnGunSwap = this.add.circle(500, 180, 20, 0xaaaaaa).setAlpha(0.5).setInteractive();
        this.add.text(484, 172, 'G-GEAR', { fontSize: '10px', fill: '#fff', fontStyle: 'bold' });
        btnGunSwap.on('pointerdown', () => {
            if (isAttacking || isReloading || isBlocking) return; 
            currentGunIndex = (currentGunIndex + 1) % gunKeys.length;
            activeGun = gunArmory[gunKeys[currentGunIndex]];
            gunText.setText('Gun: ' + activeGun.name);
            currentAmmo = activeGun.clipSize; updateUI();
        });

        // Ultimate
        specialButton = this.add.circle(680, 180, 30, 0x555555).setAlpha(0.7).setInteractive();
        this.add.text(660, 172, 'ULT', { fontSize: '16px', fill: '#fff', fontStyle: 'bold' });
        specialGraphics = this.add.graphics();
        specialButton.on('pointerdown', () => {
            if (specialReady && !isAttacking && !isBlocking) {
                player.fillColor = 0x00ffff;
                let dist = Phaser.Math.Distance.Between(player.x, player.y, dummy.x, dummy.y);
                if (dist < 180) { dealDamage(50, 0.8, 0); dummy.fillColor = 0x00ffff; this.time.delayedCall(200, () => dummy.fillColor = 0xff5555); }
                this.time.delayedCall(500, () => player.fillColor = 0x00aaff);
                specialCharge = 0; specialReady = false; specialButton.setFillStyle(0x555555); specialGraphics.clear();
            }
        });
    }

    // --- NEW: HEAVY ATTACK LOGIC ---
    function executeHeavyAttack() {
        isAttacking = true;
        inputBuffered = false;
        canCancel = false; // Heavy attacks cannot be canceled, high commitment!
        if (attackRecoveryTimer) attackRecoveryTimer.remove();
        if (attackActiveTimer) attackActiveTimer.remove();

        // 1. WINDUP PHASE (Telegraphing the attack)
        player.fillColor = 0xff5500; // Orange warning color
        actionText.setText(`WINDUP: ${activeWeapon.name}!`);
        
        // Windup duration based on weapon speed
        currentScene.time.delayedCall(activeWeapon.speed * 1.5, () => {
            
            // 2. ACTIVE PHASE (The Strike)
            player.fillColor = activeWeapon.color;
            actionText.setText(`HEAVY STRIKE!`);
            
            let currentReach = activeWeapon.reach * 1.8; // 80% longer reach
            meleeHitbox.width = currentReach; 
            meleeHitbox.height = 40; // Taller hitbox to catch jumping enemies
            meleeHitbox.setAlpha(1);

            let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
            meleeHitbox.setPosition(player.x + reachX, player.y); 
            meleeHitbox.rotation = facingDirection;

            let hit = Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), dummy.getBounds());
            if (hit) {
                // 2.5x Damage, guaranteed 0.5s stun minimum
                let heavyDmg = activeWeapon.damage * 2.5;
                let heavyStun = activeWeapon.stun > 0 ? activeWeapon.stun * 2 : 0.5;
                dealDamage(heavyDmg, activeWeapon.pierce, heavyStun);
                
                dummy.fillColor = activeWeapon.color; 
                currentScene.time.delayedCall(100, () => { if(!isStunned) dummy.fillColor = 0xff5555; });
                
                // Massive Knockback
                if(dummyHealth > 0) dummy.x += (facingDirection === 0 ? 40 : -40); 
            }

            // 3. RECOVERY PHASE (Vulnerable)
            attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
                meleeHitbox.setAlpha(0); 
                meleeHitbox.setPosition(-100, -100); 
                
                attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * 2.5, () => {
                    isAttacking = false; 
                    player.fillColor = 0x00aaff;
                    actionText.setText('Ready');
                });
            });
        });
    }

    // --- STANDARD LIGHT COMBO LOGIC ---
    function executeAttack(step) {
        isAttacking = true; comboStep = step; inputBuffered = false; canCancel = false;
        if (attackRecoveryTimer) attackRecoveryTimer.remove(); if (attackActiveTimer) attackActiveTimer.remove();
        player.fillColor = activeWeapon.color;
        let currentReach = step === 3 ? activeWeapon.reach * 1.5 : activeWeapon.reach;
        meleeHitbox.width = currentReach; meleeHitbox.height = step === 3 ? 40 : 20; meleeHitbox.setAlpha(1);
        let reachX = facingDirection === 0 ? (currentReach / 2 + 15) : -(currentReach / 2 + 15); 
        meleeHitbox.setPosition(player.x + reachX, player.y); meleeHitbox.rotation = facingDirection;

        if (Phaser.Geom.Intersects.RectangleToRectangle(meleeHitbox.getBounds(), dummy.getBounds())) {
            dealDamage(activeWeapon.damage * (step === 3 ? 2 : 1), activeWeapon.pierce, activeWeapon.stun);
            dummy.fillColor = activeWeapon.color; 
            currentScene.time.delayedCall(100, () => { if(!isStunned) dummy.fillColor = 0xff5555; });
            if(step === 3 && dummyHealth > 0) dummy.x += (facingDirection === 0 ? 10 : -10);
        }

        attackActiveTimer = currentScene.time.delayedCall(activeWeapon.speed, () => {
            meleeHitbox.setAlpha(0); meleeHitbox.setPosition(-100, -100); canCancel = true; 
            if (inputBuffered && step < 3) triggerNextHit();
            else {
                attackRecoveryTimer = currentScene.time.delayedCall(activeWeapon.speed * (step === 3 ? 2.5 : 1.5), () => {
                    isAttacking = false; comboStep = 0; inputBuffered = false; canCancel = false; player.fillColor = 0x00aaff;
                });
            }
        });
    }
    function triggerNextHit() { if (comboStep < 3) executeAttack(comboStep + 1); }

    // --- DEFENSIVE LOGIC ---
    function executeDash() {
        isDashing = true; canDash = false; isInvincible = true; actionText.setText('DODGE!');
        player.setAlpha(0.5); player.fillColor = 0x00ffff; 
        player.body.setVelocityX((facingDirection === 0) ? 700 : -700);

        currentScene.time.delayedCall(250, () => {
            isDashing = false; isInvincible = false; player.setAlpha(1); player.fillColor = 0x00aaff; actionText.setText('Ready');
        });
        currentScene.time.delayedCall(1200, () => { canDash = true; });
    }

    function playerTakeDamage(incomingDmg, attackXLocation) {
        if (isInvincible) return; // Evaded!
        let playerFacingRight = (facingDirection === 0);
        let attackFromRight = (attackXLocation > player.x);
        if (isBlocking) {
            if ((playerFacingRight && attackFromRight) || (!playerFacingRight && !attackFromRight)) incomingDmg *= 0.2; 
        }
        playerHealth -= incomingDmg;
        if (playerHealth <= 0) playerHealth = 100; 
    }

    // --- ORDNANCE & GUN LOGIC ---
    function tossGrenade() {
        let currentTime = currentScene.time.now;
        if (currentOrdnanceAmmo <= 0 || isAttacking || isBlocking || isDashing || currentTime < lastTossedTime + activeOrdnance.cooldown) return;
        currentOrdnanceAmmo--; updateUI(); lastTossedTime = currentTime; actionText.setText("TOSS!");
        let nade = currentScene.add.circle(player.x, player.y - 10, 6, activeOrdnance.color);
        currentScene.physics.add.existing(nade);
        nade.body.setBounce(0.6); nade.body.setDrag(100, 0); nade.body.setCollideWorldBounds(true);
        grenadesGroup.add(nade);
        nade.body.setVelocity((facingDirection === 0) ? 350 : -350, -400);
        currentScene.time.delayedCall(activeOrdnance.fuse, () => explodeGrenade(nade));
    }

    function explodeGrenade(nade) {
        let exX = nade.x, exY = nade.y; nade.destroy();
        let blastVisual = currentScene.add.circle(exX, exY, activeOrdnance.radius, 0xff7700, 0.7);
        let dist = Phaser.Math.Distance.Between(exX, exY, dummy.x, dummy.y);
        if (dist <= activeOrdnance.radius) {
            dealDamage(activeOrdnance.damage, 0.5, 0);
            dummy.fillColor = 0xff7700;
            currentScene.time.delayedCall(150, () => { if(!isStunned) dummy.fillColor = 0xff5555; });
        }
        currentScene.tweens.add({ targets: blastVisual, alpha: 0, duration: 250, onComplete: () => blastVisual.destroy() });
    }

    function reloadGun() {
        isReloading = true; actionText.setText(`Reloading...`); ammoText.setText('RELOADING...'); ammoText.setFill('#ff0000'); 
        reloadTimer = currentScene.time.delayedCall(activeGun.reloadTime, () => {
            currentAmmo = activeGun.clipSize; isReloading = false; updateUI(); actionText.setText('Ready');
        });
    }

    function updateUI() {
        ammoText.setText(`Ammo: ${currentAmmo} / ${activeGun.clipSize}`);
        if (currentAmmo === 0) ammoText.setFill('#ff0000'); else if (currentAmmo <= activeGun.clipSize * 0.25) ammoText.setFill('#ffaa00'); else ammoText.setFill('#00ffff'); 
        grenadeText.setText(`Nades: ${currentOrdnanceAmmo} / ${activeOrdnance.maxAmmo}`);
        if (currentOrdnanceAmmo === 0) grenadeText.setFill('#ff0000'); else grenadeText.setFill('#00ff00');
    }

    function shootGun(baseAngle) {
        let bulletCount = activeGun.count, spreadAngle = 0.15; 
        for (let i = 0; i < bulletCount; i++) {
            let offset = (i - Math.floor(bulletCount / 2)) * spreadAngle, currentAngle = baseAngle + offset;
            let bullet = currentScene.add.rectangle(player.x, player.y, 12, 4, activeGun.color);
            currentScene.physics.add.existing(bullet); bullet.body.setAllowGravity(false); 
            currentScene.physics.velocityFromRotation(currentAngle, activeGun.speed, bullet.body.velocity); bullet.rotation = currentAngle;
            currentScene.physics.add.overlap(bullet, dummy, () => {
                bullet.destroy(); dealDamage(activeGun.damage, 0.20, 0); dummy.fillColor = activeGun.color; 
                currentScene.time.delayedCall(50, () => { if(!isStunned) dummy.fillColor = 0xff5555; });
            });
            currentScene.time.delayedCall(activeGun.lifespan, () => { if(bullet.active) bullet.destroy(); });
        }
    }

    function dealDamage(dmg, piercePercent, stunDuration) {
        let piercingDmg = dmg * piercePercent, standardDmg = dmg - piercingDmg;
        if (dummyArmor > 0) { dummyArmor -= standardDmg; if (dummyArmor < 0) { dummyHealth += dummyArmor; dummyArmor = 0; }
        } else dummyHealth -= standardDmg;

        dummyHealth -= piercingDmg; if (dummyHealth < 0) dummyHealth = 0;
        
        if (stunDuration > 0) {
            isStunned = true; dummy.fillColor = 0x00ffff;
            currentScene.time.delayedCall(stunDuration * 1000, () => { isStunned = false; dummy.fillColor = 0xff5555; });
        }

        if (dummyHealth <= 0) { dummyHealth = 100; dummyArmor = 100; currentOrdnanceAmmo = activeOrdnance.maxAmmo; updateUI(); }
        updateDummyBars();
    }

    function updateDummyBars() {
        dummyHealthBar.clear(); dummyArmorBar.clear();
        dummyHealthBar.fillStyle(0x333333, 1).fillRect(dummy.x - 25, dummy.y - 45, 50, 6);
        dummyArmorBar.fillStyle(0x333333, 1).fillRect(dummy.x - 25, dummy.y - 36, 50, 6);
        dummyHealthBar.fillStyle(0x00ff00, 1).fillRect(dummy.x - 25, dummy.y - 45, 50 * (dummyHealth / 100), 6);
        dummyArmorBar.fillStyle(0xcccccc, 1).fillRect(dummy.x - 25, dummy.y - 36, 50 * (dummyArmor / 100), 6);
    }

    // --- MAIN GAME LOOP ---
    function update() {
        if (isStunned) return;
        const moveSpeed = 250;
        let currentTime = currentScene.time.now;
        
        if (isDashing) {
            // Dash locks out joystick
        } else if (isAttacking || isBlocking) {
            player.body.setVelocityX(0); // Rooted
        } else {
            if (joyStickLeft.left) { player.body.setVelocityX(-moveSpeed); facingDirection = Math.PI; }
            else if (joyStickLeft.right) { player.body.setVelocityX(moveSpeed); facingDirection = 0; }
            else player.body.setVelocityX(0);
        }

        if (player.body.touching.down) jumps = 0;

        if (joyStickLeft.up) {
            if (joystickUpReleased && jumps < 3 && !isAttacking && !isBlocking && !isDashing) {
                player.body.setVelocityY(-450); jumps++; joystickUpReleased = false;
            }
        } else joystickUpReleased = true;

        if (joyStickRight.force > 0) {
            player.rotation = joyStickRight.rotation; facingDirection = joyStickRight.rotation; 
            if (currentTime > lastFiredTime + activeGun.fireRate && !isAttacking && !isReloading && !isBlocking && !isDashing) {
                if (currentAmmo > 0) { shootGun(joyStickRight.rotation); currentAmmo--; updateUI(); lastFiredTime = currentTime;
                } else reloadGun();
            }
        } else if (!isAttacking && !isDashing) player.rotation = facingDirection; 

        if (!specialReady) {
            specialCharge += 0.2; specialGraphics.clear(); specialGraphics.lineStyle(6, 0x00ffff, 1); specialGraphics.beginPath();
            specialGraphics.arc(680, 180, 36, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(-90 + (360 * (specialCharge/specialMax))), false);
            specialGraphics.strokePath();
            if (specialCharge >= specialMax) { specialReady = true; specialButton.setFillStyle(0x00ffff); }
        }
    }
</script>

</body>
</html>
