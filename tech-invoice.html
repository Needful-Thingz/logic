<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Invoice | Needful Thingz</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* --- MOBILE-FIRST STYLING --- */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #e2e8f0; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column;
            align-items: center;
        }
        .app-container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 600px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow: hidden; 
        }

        /* --- HEADER --- */
        .header { 
            background: #2f855a; 
            color: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { 
            background: rgba(255,255,255,0.2); 
            color: white; 
            text-decoration: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: bold; 
        }

        /* --- JOB LIST --- */
        .panel { padding: 20px; }
        .section-title { font-size: 14px; color: #718096; text-transform: uppercase; font-weight: bold; margin-top: 0; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }
        
        .job-card {
            background: #f7fafc;
            border: 1px solid #cbd5e0;
            border-left: 5px solid #2f855a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .job-card:active { transform: scale(0.98); }
        .j-name { font-weight: 800; font-size: 16px; color: #2d3748; display: flex; justify-content: space-between; }
        .j-type { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #4a5568; }
        .j-addr { font-size: 13px; color: #4a5568; margin: 8px 0; }
        .j-symp { font-size: 13px; color: #c53030; font-weight: bold; background: #fff5f5; padding: 8px; border-radius: 4px; }

        /* --- INVOICE CLOSEOUT FORM --- */
        #closeout-section { display: none; background: #f0fff4; border-top: 2px solid #c6f6d5; padding: 20px; }
        .active-job-header { font-size: 18px; font-weight: bold; color: #276749; margin-bottom: 15px; }

        /* --- AI BUTTON STYLING --- */
        .ai-panel { background: #faf5ff; border: 2px solid #b794f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .ai-btn { background: #805ad5; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(128, 90, 213, 0.3); transition: 0.2s; }
        .ai-btn.recording { background: #e53e3e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        #aiStatus { font-size: 11px; text-align: center; color: #553c9a; font-weight: bold; margin-top: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #2f855a; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 16px; 
        }
        
        .money-input { font-size: 20px !important; font-weight: bold; color: #2d3748; }

        .btn-complete { 
            background: #2f855a; 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn-cancel {
            background: transparent;
            color: #718096;
            border: 1px solid #cbd5e0;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Tech Invoice</h1>
        <a href="index.html" class="back-btn">Exit</a>
    </div>

    <div class="panel" id="list-section">
        <h2 class="section-title">Open Dispatches</h2>
        <div id="jobFeed">
            <div style="text-align:center; color:#a0aec0; padding: 20px;">Checking for dispatches...</div>
        </div>
    </div>

    <div id="closeout-section">
        <div class="active-job-header" id="active-job-name">Closing: John Doe</div>
        
        <!-- AI ENGINE PANEL -->
        <div class="ai-panel">
            <button type="button" id="recordBtn" class="ai-btn">🎙️ Auto-Fill with AI</button>
            <div id="aiStatus">System Ready: Tap to speak field notes</div>
        </div>

        <div class="form-group">
            <label>Field Diagnostics & Notes</label>
            <textarea id="tech_notes" rows="3" placeholder="Found blown capacitor. Replaced and tested system."></textarea>
        </div>

        <div class="form-group">
            <label>Materials & Parts Used</label>
            <textarea id="materials" rows="2" placeholder="1x 45/5 MFD Capacitor, 2 lbs R-410A"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Labor Hours</label>
                <input type="number" id="labor" placeholder="1.5" step="0.1">
            </div>
            <div class="form-group">
                <label>Total Billed ($)</label>
                <input type="number" id="price" class="money-input" placeholder="0.00" step="0.01">
            </div>
        </div>

        <button type="button" class="btn-complete" id="submitBtn" onclick="submitInvoice()">Submit & Close Ticket</button>
        <button type="button" class="btn-cancel" onclick="cancelCloseout()">Cancel</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://zndgwxlnwftschvwwvob.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZGd3eGxud2Z0c2Nodnd3dm9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTg1MzksImV4cCI6MjEwMjM5NDUzOX0.jqXapcoBUOyG0TbE8AX0hKQQu6Pl_b-j2Qb-yrf8t6Q';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTicketId = null; 

    // 1. SECURITY BOUNCER
    async function enforceSecurity() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error || !session) {
            window.location.href = 'login.html'; 
        } else {
            loadOpenJobs(); 
        }
    }
    enforceSecurity();

    // 2. FETCH OPEN JOBS
    async function loadOpenJobs() {
        const feed = document.getElementById('jobFeed');
        
        const { data: tickets, error } = await supabaseClient
            .from('dispatch_tickets')
            .select('*')
            .eq('status', 'open')
            .order('created_at', { ascending: false });

        if (error) { feed.innerHTML = `Error: ${error.message}`; return; }
        if (tickets.length === 0) {
            feed.innerHTML = `<div style="text-align:center; color:#718096; font-style:italic;">No open dispatches. Go grab a coffee.</div>`;
            return;
        }

        feed.innerHTML = '';
        tickets.forEach(ticket => {
            feed.innerHTML += `
                <div class="job-card" onclick="openCloseout('${ticket.id}', '${ticket.customer_name}')">
                    <div class="j-name">${ticket.customer_name} <span class="j-type">${ticket.system_type}</span></div>
                    <div class="j-addr">📍 ${ticket.address}</div>
                    <div class="j-symp">Issue: ${ticket.symptom}</div>
                </div>
            `;
        });
    }

    // 3. UI LOGIC
    function openCloseout(ticketId, customerName) {
        currentTicketId = ticketId; 
        document.getElementById('active-job-name').innerText = "Closing: " + customerName;
        document.getElementById('list-section').style.display = 'none'; 
        document.getElementById('closeout-section').style.display = 'block'; 
    }

    function cancelCloseout() {
        currentTicketId = null;
        document.getElementById('closeout-section').style.display = 'none';
        document.getElementById('list-section').style.display = 'block';
    }

    // 4. SUBMIT TO VAULT
    async function submitInvoice() {
        if(!currentTicketId) return;

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.style.opacity = '0.7';

        const { error } = await supabaseClient
            .from('dispatch_tickets')
            .update({ 
                status: 'completed', 
                tech_notes: document.getElementById('tech_notes').value,
                materials_used: document.getElementById('materials').value,
                labor_hours: document.getElementById('labor').value,
                total_price: document.getElementById('price').value
            })
            .eq('id', currentTicketId);

        if (error) {
            alert("Error saving invoice: " + error.message);
            btn.innerText = "Submit & Close Ticket";
            btn.style.opacity = '1';
        } else {
            alert("Job Completed & Sent to Office!");
            document.getElementById('tech_notes').value = '';
            document.getElementById('materials').value = '';
            document.getElementById('labor').value = '';
            document.getElementById('price').value = '';
            
            cancelCloseout(); 
            loadOpenJobs(); 
            btn.innerText = "Submit & Close Ticket";
            btn.style.opacity = '1';
        }
    }

    // 5. AI VOICE PIPELINE
    let mediaRecorder;
    let audioChunks = [];
    const recordBtn = document.getElementById('recordBtn');
    const aiStatus = document.getElementById('aiStatus');

    recordBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            recordBtn.innerHTML = '⚙️ Processing AI...';
            recordBtn.style.background = '#d69e2e';
            recordBtn.classList.remove('recording');
            aiStatus.innerText = 'Transmitting securely to cloud...';
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('file', audioBlob, 'recording.webm');

                try {
                    const response = await fetch('https://zndgwxlnwftschvwwvob.supabase.co/functions/v1/voice-to-invoice', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    
                    if(result.invoice) {
                        document.getElementById('tech_notes').value = result.invoice.work_summary || '';
                        document.getElementById('materials').value = (result.invoice.parts_used || []).join(', ');
                        document.getElementById('labor').value = result.invoice.labor_hours || '';
                        document.getElementById('price').value = result.invoice.total_estimated_cost || '';
                        
                        recordBtn.innerHTML = '✅ AI Complete';
                        recordBtn.style.background = '#38a169';
                        aiStatus.innerText = 'Data mapped successfully.';
                    } else {
                        aiStatus.innerText = 'Failed to map data.';
                        recordBtn.innerHTML = '🎙️ Auto-Fill with AI';
                        recordBtn.style.background = '#805ad5';
                    }
                } catch (err) {
                    aiStatus.innerText = 'Transmission Error: ' + err.message;
                    recordBtn.innerHTML = '🎙️ Auto-Fill with AI';
                    recordBtn.style.background = '#805ad5';
                }
            };

            mediaRecorder.start();
            recordBtn.innerHTML = '🛑 Stop & Generate';
            recordBtn.style.background = '#e53e3e';
            recordBtn.classList.add('recording');
            aiStatus.innerText = 'Listening to field notes...';
        } catch (err) {
            alert('Microphone access denied. Please allow microphone permissions.');
        }
    });
</script>

</body>
</html>
